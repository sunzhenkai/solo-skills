version: 1
skill: taskflow
cases:
  - id: one-driver-change
    kind: basic
    judge: deterministic
    description: 一个任务等于一个 {task}-driver，子 change 共享前缀
    given: 用户点名 taskflow 或要把任务拆成多个 OpenSpec change
    expect:
      must:
        - 建 {task}-driver；子 change 命名 {task}-<slice>
        - 与 driver 同一 planning root；跨 root 时在涉及面表显式记录
      must_not:
        - 另建 tasks/ 台账、索引文件或编号体系

  - id: only-taskflow-new-command
    kind: basic
    judge: deterministic
    description: 只提供 taskflow-new；其余阶段委托 stock openspec-*
    given: 澄清 / 提案 / 实施 / 归档
    expect:
      must:
        - explore/propose/apply/archive 委托对应 stock skill，参数为 {task}-driver
      must_not:
        - 另造等价的 taskflow-explore/propose/apply/archive 命令

  - id: skip-specs-required
    kind: basic
    judge: deterministic
    description: "driver 必须显式 skip_specs: true"
    given: taskflow-new 脚手架
    expect:
      must:
        - 在 driver 的 .openspec.yaml 写入 skip_specs: true
      must_not:
        - 让 driver 带 spec 增量却不写 skip_specs

  - id: scaffold-three-steps
    kind: core
    judge: deterministic
    description: taskflow-new 固定三步且不写 tasks.md
    given: taskflow-new {任务描述}
    expect:
      must:
        - 归纳 kebab-case {task}（描述为空才问）
        - openspec new change {task}-driver --goal 任务描述原文
        - 写 skip_specs 并按模板写 proposal.md
        - 报告 change name、proposal 路径与待确认空缺，并提示 propose 应选继续已有 change
      must_not:
        - 脚手架阶段写 tasks.md
        - 改写或精简 Driver 协议固定文本

  - id: driver-protocol-verbatim
    kind: core
    judge: deterministic
    description: proposal.md 的 Driver 协议小节逐字写入
    given: 写 driver proposal
    expect:
      must:
        - Driver 协议与 SKILL 模板固定文本一致
        - 含 skip_specs、子 change 命名、checkbox 进度、两个根与必须仓建 worktree 规则、提交只到任务分支、一轮结束三条件
      must_not:
        - 改写、精简或挪走 Driver 协议

  - id: propose-tasks-skeleton
    kind: core
    judge: deterministic
    description: propose 产出的 driver tasks.md 含准备/实施/收尾骨架
    given: openspec-propose 处理 {task}-driver
    expect:
      must:
        - 准备段含给必须仓建 worktree 的条目
        - 实施段每个子 change 至少一条，且须 apply 至全勾且 validate --strict 通过
        - 收尾段含回归、回填验收、提交与归档全部子 change
      must_not:
        - 在 apply 实施循环里改 change 语义或补拆子 change

  - id: checkbox-ssot
    kind: core
    judge: deterministic
    description: 进度只有 checkbox 一种真相
    given: 判断 driver 或子 change 完成度
    expect:
      must:
        - 子 change tasks.md 记实现进度，driver tasks.md 记编排进度
        - driver 实施 checkbox 仅在对应子 change 全勾且 validate --strict 通过后才勾
        - 暂缓原因写进 proposal 验证记录
      must_not:
        - 持久化第二份完成度、暂缓或分支状态记录

  - id: fail-closed-must-repos
    kind: core
    judge: deterministic
    description: 必须修改仓的代码改在 worktrees/{task}；tasks/ 与 openspec change 留在主工作树；主工作树与用户未提交改动不动
    given: 准备涉及面角色为必须的修改仓
    expect:
      must:
        - openspec-* 在 planning root（主工作树）跑；改代码、测试、提交在 worktrees/{task}
        - 先 fetch；基线默认 origin/<默认分支>，当前分支不是默认分支且领先时用 HEAD；git worktree add worktrees/{task} -b {task} <基线>
        - 分支已存在用 git worktree add worktrees/{task} {task}；worktree 已存在则复用
        - 把 worktrees/ 写进 .git/info/exclude，worktree 路径与基线记入「已做决定」
        - 派给实现者的工作目录是 worktree 的绝对路径；同一任务的 worker 共用这个 worktree
        - 提交只落在任务分支 {task}；git 拒绝时停下说明原因
      must_not:
        - 在主工作树上切分支、stash 或 reset
        - 对建议/排除仓建 worktree
        - 分支已存在时用 origin/<默认分支> 作参数建出 detached HEAD
        - push、合进默认分支或收尾自动删除 worktree

  - id: round-end-three-only
    kind: core
    judge: deterministic
    description: 只有全勾、需用户决策、预算耗尽允许结束一轮
    given: apply {task}-driver 一轮
    expect:
      must:
        - 单项做不了保持未勾，写原因后继续其余项
        - 结束时逐条列出未勾项与原因
      must_not:
        - 把未完成项勾成完成
        - 用按 change 汇总的剩余数量代替逐条说明
        - 因一项卡住整轮停下

  - id: parallel-independent-units
    kind: core
    judge: deterministic
    description: 有多 agent 时对独立 task / 子 change 并行，依赖项与收尾串行
    given: apply {task}-driver 且实施段有多个互不依赖的子 change，或某子 change 内有互不依赖的 checkbox
    expect:
      must:
        - 有多 agent 能力时对无依赖、范围不重叠的 task 或子 change 并行委派
        - 每个子代理绑定 planning root 与 change name，只改自己范围
        - 主会话汇总，并在子 change 全勾且 validate --strict 通过后才勾 driver 编排项
      must_not:
        - 对有依赖、同范围重叠、准备段建 worktree 或收尾段条目并行
        - 另建第二份进度账本
        - 因子代理失败而整轮结束

  - id: no-invented-openspec-commands
    kind: failure
    judge: deterministic
    description: openspec-* 不可用时停下报告，不发明等价命令
    given: 当前环境没有 openspec-* skill
    expect:
      must:
        - 停下并给出可选项（dotf agents -c 或 openspec init --tools agents 装到全局，或 openspec CLI 直调）
      must_not:
        - 自行发明等价命令并继续

  - id: no-unbound-delegation
    kind: failure
    judge: deterministic
    description: 委托必须在 driver planning root 下且显式给 {task}-driver
    given: 委托 openspec-explore/propose/apply/archive
    expect:
      must:
        - 在 driver 的 planning root 下执行
        - 显式给出 change name {task}-driver
      must_not:
        - 缺绑定仍委托

  - id: archive-driver-only
    kind: boundary
    judge: deterministic
    description: stock 归档只归档 driver 自身；子 change 在收尾 checkbox 已归档
    given: 对 {task}-driver 执行 openspec-archive-change
    expect:
      must:
        - 只归档 driver 自身，不做递归
      must_not:
        - 在 driver 归档步骤里再递归归档子 change（应收尾段已完成）

  - id: skip-specs-regression
    kind: regression
    judge: deterministic
    description: 不写 skip_specs 会导致 validate --strict 失败
    given: 新建 driver 后跑 openspec status/validate
    expect:
      must:
        - skip_specs 已写入；status --json 中 specs 为 skipped
      must_not:
        - driver 无 spec 却未设 skip_specs

  - id: scaffold-must-leave-tasks-empty
    kind: regression
    judge: deterministic
    description: 脚手架写满 tasks.md 会让 openspec-propose 空转
    given: taskflow-new 刚完成
    expect:
      must:
        - tasks.md 不存在或未由脚手架写满，留给 propose
      must_not:
        - 脚手架阶段把 tasks 写满

  - id: normal-delivery-input-context
    kind: core
    judge: deterministic
    description: 正常交付实现者拿到交接载荷生成的输入；点名画像时一并给画像
    given: 派发普通复杂交付的实现者
    expect:
      must:
        - 实现者收到判据原文、交付类别、本人范围、要产出的证据与指针；用户点名质量画像时另给画像或保留语义的子范围裁剪
        - 实现者收到本人范围的相关验收要求与运行约束
        - 完整 rubric 与跨范围审阅意见仍由审阅者持有
      must_not:
        - 普通任务默认盲派
        - 隐藏并发、无障碍、错误边界或运行假设等质量约束

  - id: blind-regression-input-isolation
    kind: core
    judge: deterministic
    description: 仅显式 benchmark/regression 复跑隔离验收期望
    given: 任务显式标记 benchmark 或 regression 并派发盲测实现者
    expect:
      must:
        - 实现者只收到同一份样例/需求原文与运行约束
        - 审阅者持有质量画像与 rubric，两边不共享
        - 复跑不追加事后提示
      must_not:
        - 未标记 benchmark/regression 就盲派
        - 把质量画像、验收 rubric 或期望页面清单写进实现者 prompt
        - 靠私聊提示词传递未写进需求原文的期望

  - id: entry-gate-handoff-pass
    kind: core
    judge: deterministic
    description: taskflow-new 前先跑 scripts/check_handoff.py；handoff 成立才建 driver
    given: tasks/ongoing/<slug>/TASK.md 元信息 status handed-off、phase ∈ propose/apply/archive/done，「## 交接」含交付类别与适用门包（Web UI 另含 Active Instance 根路径与 contract/binding/projection 三条 digest）
    expect:
      must:
        - 建 driver / 派实现前执行 check_handoff.py <workspace-root> <slug>，exit 0（PASS）后才继续
        - 交接载荷里的交付类别与适用门包随 driver 带入实施
      must_not:
        - 不跑入口门就直接 openspec new change {task}-driver

  - id: entry-gate-handoff-block
    kind: failure
    judge: deterministic
    description: 入口门 exit 1 时拒绝建 driver 并回 taskrail
    given: TASK.md 缺失，或 status 非 handed-off / phase 仍在 approve 之前，或缺「## 交接」节、交付类别、适用门包，或 Web UI 缺任一 digest / Active Instance 根路径
    expect:
      must:
        - 拒绝建 driver，逐条报告 FAIL 项，引导回 taskrail 走完 approve → handoff
      must_not:
        - 手写省略 UI / 验收的自由提示词绕过入口门派实现
        - 自行补写 status / 交接载荷让门变绿

  - id: entry-gate-bypass-user-only
    kind: boundary
    judge: deterministic
    description: 用户原话要求跳过 taskrail 时，agent 照录原话写 gate_bypass，脚本以 BYPASS 放行
    given: 用户说「不走 taskrail，直接建 driver」
    expect:
      must:
        - 没有 TASK.md 时按 task-explore 模板建最小的一份
        - 元信息写 gate_bypass "<日期> user-confirmed: <用户原话>"，BYPASS 放行（exit 0、醒目警告）
        - 没验证到的门包项按 done.md 第 6 条记进「已做决定」
        - 缺 user-confirmed 或缺理由时 exit 1
      must_not:
        - 用户没说跳过时写 gate_bypass
        - 用自己编的理由代替用户原话

  - id: web-ui-no-external-ui-skill
    kind: regression
    judge: deterministic
    description: Web UI 实现不依赖仓外 ui-templates 系列 skill
    given: Web UI 切片需要实现代表页
    expect:
      must:
        - 按代表页 two-pass 方法实现并修订一条主流程代表页，消费 frozen Active Instance
        - 缺 Active Instance 时回 design 阶段在交付项目根建立并 freeze
      must_not:
        - 要求安装或委托 ui-template-design / ui-template-apply / ui-template-author

  - id: aesthetic-visual-direction
    kind: core
    judge: llm
    description: 有观感目标的 Web UI 切片先定视觉方向再实现
    given: driver 的 Web UI 切片对应观感类目标
    expect:
      must:
        - 实现者先读 pretty-view-html/references/frontend-design/REFERENCE.md，按计划里的视觉方向实现
        - 收口按 taskrail done.md「观感验收」
      must_not:
        - 沿用框架默认样式只点缀几处颜色就收工
