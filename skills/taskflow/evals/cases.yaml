version: 1
skill: taskflow
cases:
  - id: direct-uses-worktree-without-driver
    kind: core
    judge: deterministic
    description: direct 与 OpenSpec 共用隔离但不共用编排产物
    given: taskrail 选择 direct 实施一个 git 代码任务
    expect:
      must:
        - 运行 prepare_worktree.py，在返回的任务 worktree 改代码、测试和提交
        - PLAN 记录实施进度，证据记录验证
      must_not:
        - 创建 driver 或调用 check_handoff.py
        - 在源 checkout 切分支或直接写代码

  - id: openspec-workspace-driver
    kind: core
    judge: deterministic
    description: OpenSpec 所有 planning 产物留在 workspace
    given: taskrail 选择 OpenSpec，涉及一个或多个项目仓库
    expect:
      must:
        - 在 workspace 创建 task-driver 和 task-slice 子 changes
        - 所有 openspec 命令以 workspace 为 cwd 并显式给 change name
        - driver 的 .openspec.yaml 显式写 skip_specs true
      must_not:
        - 因跨项目更换 planning root
        - 在项目 checkout 内另建一套任务台账

  - id: multi-repository-worktrees
    kind: core
    judge: deterministic
    description: 同一任务两个真实仓库分别获得 worktree
    given: task demo 同时修改 backend 和 frontend 两个 git 仓
    expect:
      must:
        - 分别准备 worktrees/demo/backend 和 worktrees/demo/frontend
        - registry.json 同时登记两个 source、worktree、branch 和 base
        - 两仓各自存在 task/demo 分支且互不覆盖
      must_not:
        - 让两个仓库共用一个 worktree
        - 把 repo_id 静默改绑到另一个 source

  - id: no-remote-default-base
    kind: core
    judge: deterministic
    description: 无 remote 也能创建和恢复
    given: source 只有本地 main 和一个提交，没有 origin
    expect:
      must:
        - 默认以 HEAD 为基线创建任务分支和 worktree
        - 干净重跑返回 resumed，源仓仍在 main
      must_not:
        - 强制 fetch 或虚构 origin 默认分支
        - 因无 remote 失败

  - id: dirty-worktree-fails-preserving-work
    kind: failure
    judge: deterministic
    description: 脏任务 worktree 返回非零并保留现场
    given: 已登记 worktree 含未提交修改
    expect:
      must:
        - prepare_worktree.py 返回非零，原修改逐字保留
        - 用户先检查并处理后再恢复
      must_not:
        - stash、reset、覆盖或自动提交用户修改

  - id: dirty-source-is-not-copied
    kind: core
    judge: deterministic
    description: 源 checkout 的未提交修改不隐式进入任务分支
    given: source 工作区有未提交修改，HEAD 可作为基线
    expect:
      must:
        - 新 worktree 来自显式基线提交，源修改保持原样
        - 若需要以未提交修改为输入，先显式记录并获用户认可
      must_not:
        - 自动复制源工作区修改
        - 切换源仓分支或清理源工作区

  - id: branch-and-identity-collisions
    kind: failure
    judge: deterministic
    description: 未登记分支和错误身份不能静默复用
    given: 同名任务分支已存在但无 registry，或已有 worktree 的 branch/source 不匹配
    expect:
      must:
        - 返回非零并说明冲突，保留已有分支和目录
      must_not:
        - 建 detached HEAD 掩盖冲突
        - 复用不明身份的旧任务 worktree

  - id: nested-workspace-exclude
    kind: edge
    judge: deterministic
    description: 只有 worktree 位于 source 内才写 exclude
    given: workspace 就是 source 项目根，或 workspace 与 source 分离
    expect:
      must:
        - 内嵌场景把对应顶层 worktrees 目录写 .git/info/exclude
        - 分离场景不改 source exclude
      must_not:
        - 修改项目 .gitignore
        - 无条件写 exclude

  - id: handoff-new-metadata-pass
    kind: core
    judge: deterministic
    description: 新 OpenSpec 元信息通过入口门
    given: TASK 为 active、execution openspec、current_ref execute，criterion 和 driver 正确，交接载荷完整
    expect:
      must:
        - check_handoff.py exit 0 后才创建 driver
        - 有 approve 要求时读取 reviews 或旧 approve 下 APPROVED.md
      must_not:
        - 未跑入口门直接 openspec new change
        - direct 使用该入口门

  - id: handoff-not-required-needs-reason
    kind: boundary
    judge: deterministic
    description: 无需 approve 必须有具体理由
    given: router 判定普通可逆改动无需 approve，没有 APPROVED.md
    expect:
      must:
        - 交接节写批准 not-required 加具体理由后可通过
        - 空 not-required 或无批准文件且无理由时失败
      must_not:
        - 用空标记代替理由
        - 为无需 approve 的 direct 伪造批准文件

  - id: handoff-rejects-direct-and-bad-path
    kind: failure
    judge: deterministic
    description: direct 和路径逃逸均被拒绝
    given: TASK execution direct，或 task path 含父目录跳转
    expect:
      must:
        - direct 返回非零并说明不走 OpenSpec 入口门
        - 非 task-id 或 parent/subtasks/child 形式返回非零
      must_not:
        - 读取 workspace tasks/ongoing 外的 TASK
        - 自动改写元信息让门通过

  - id: legacy-handoff-compatible
    kind: regression
    judge: deterministic
    description: 旧 handed-off 和 phase 任务仍可校验
    given: 旧 TASK 含 handed-off、合法 phase、criterion、driver 和完整交接载荷
    expect:
      must:
        - 保留兼容读取并按原门校验，旧 approve 目录可用
      must_not:
        - 把兼容读取变成恢复固定双流程
        - 接受非法 legacy phase

  - id: gate-bypass-user-only
    kind: boundary
    judge: deterministic
    description: gate_bypass 只能照录用户明确原话
    given: 用户明确说不走 taskrail 直接建 driver
    expect:
      must:
        - gate_bypass 含 user-confirmed 和原话，输出醒目 BYPASS 警告
        - 未核对项在 decisions 或 SUMMARY 按实际降级记录
      must_not:
        - 用户未要求时自行 bypass
        - 用 agent 编的理由代替用户原话

  - id: web-ui-handoff-digests
    kind: failure
    judge: deterministic
    description: Web UI 交接缺 digest 不能通过
    given: 交付类别 Web UI，但 Active Instance 根路径或 contract、binding、projection digest 任一缺失
    expect:
      must:
        - 入口门逐项 FAIL，补齐后重跑
      must_not:
        - 手写省略 UI 验收的自由提示词绕过
        - 把缺证据标成 not_applicable 而不写理由

  - id: scaffold-leaves-tasks-for-propose
    kind: core
    judge: deterministic
    description: driver 脚手架不抢 propose 的职责
    given: 已创建 task-driver 并写 proposal
    expect:
      must:
        - skip_specs true 和 Driver 协议逐字落入 proposal
        - tasks.md 留给 stock openspec-propose 生成准备、实施、收尾骨架
      must_not:
        - 脚手架写满 tasks.md
        - 改写或精简 Driver 协议

  - id: rolling-wave-and-checkbox-ssot
    kind: core
    judge: deterministic
    description: 只展开就绪切片，逐片验证提交后勾编排项
    given: driver 有三个切片，后两片依赖第一片
    expect:
      must:
        - propose 只展开依赖已满足的切片
        - 子 change tasks.md 记实施，driver tasks.md 记编排
        - 第一片全勾、validate strict 并提交后才勾 driver 项，再从当前 worktree 起草后片
      must_not:
        - 一次按设想写满所有后片
        - 在 ROADMAP 或父 driver 再复制一份子任务实施进度

  - id: archive-never-masks-unchecked-work
    kind: failure
    judge: deterministic
    description: 未勾齐不能归档
    given: 某子 change 仍有未勾项或验证未通过
    expect:
      must:
        - 保持未勾并写原因，继续其他就绪项
        - 只有全勾、validate 和评审校核过后才使用 archive yes 非交互命令
      must_not:
        - 用 yes 掩盖未勾项
        - 把未完成项勾成完成

  - id: stock-pauses-orchestrated
    kind: core
    judge: deterministic
    description: stock OpenSpec 普通停顿不额外打断任务
    given: 经 taskrail 委托且同名 change 已存在，approve 已放行
    expect:
      must:
        - 同名 change 选继续，不问
        - 在批准范围内 propose 后接着 apply，普通停点由编排者代答
      must_not:
        - 向用户问继续还是新建
        - 把危险动作授权当成普通停顿自动放行

  - id: default-serial-and-independent-parallel
    kind: core
    judge: deterministic
    description: 同任务同仓写串行，独立子任务或仓库才并行
    given: 有多个实施单位，其中两个共享同一仓库，另外两个属于不同仓库
    expect:
      must:
        - 默认串行，同任务同仓的代码写、测试、git index 和提交串行
        - 不同子任务或不同仓库且无未完成依赖时才并行
      must_not:
        - 仅凭文件不重叠让多个写 worker 共享 worktree
        - 并行父 TASK、driver 编排项或最终回归

  - id: shared-contract-broadcast-and-sample
    kind: core
    judge: deterministic
    description: 共享面变化先广播，新交付形态样板先行
    given: 多 worker 任务需要修改共享接口并铺开一种新交付形态
    expect:
      must:
        - 先冻结并广播接口、类型、共享组件和目录契约
        - 先完成一个样板并验收，再铺开其他单位
      must_not:
        - 各 worker 私下改变共享契约
        - 未验证样板就全面铺开

  - id: worker-input-and-output-budget
    kind: core
    judge: deterministic
    description: worker 上下文按最小必要范围裁剪
    given: 父任务有长历史、多个子任务和大量原始日志
    expect:
      must:
        - 输入仅含本人范围、criterion、必要契约、worktree 绝对路径和证据要求
        - 返回摘要、修改与验证结果、路径和未决，原始日志留文件
      must_not:
        - 输入完整历史、兄弟子任务或无关评审
        - 把完整工具轨迹回灌父会话

  - id: driver-archive-returns-to-taskrail
    kind: core
    judge: deterministic
    description: OpenSpec 收尾不等于任务完成
    given: driver 和子 changes 已归档
    expect:
      must:
        - 回 taskrail verify 和 close，按 done.md 验证总判据与知识闭环
      must_not:
        - 在 taskflow 自行标任务 done
        - 自动 push、合默认分支或删除 worktree

  - id: missing-openspec-capability
    kind: failure
    judge: deterministic
    description: 缺 OpenSpec 能力不发明等价命令
    given: 已选择 OpenSpec，但 CLI 或 stock skills 不可用
    expect:
      must:
        - 说明缺失能力和安装方式，保留任务与其他就绪项状态
      must_not:
        - 编造等价 openspec 命令继续
        - 静默改走 direct 或把任务标完成
