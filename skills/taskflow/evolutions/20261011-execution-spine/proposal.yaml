skill: taskflow

problem: |
  执行段缺可机械核对的「契约 / 证据 / 状态」脊梁，五类失效同源：
  F4 契约未冻结即并行（共享面漂移，多单元同批返工）；
  F5 同类失败不升级（按各自 bug 修，不判契约缺陷）；
  F6 评审集中收尾（返工堆在最后一次性暴露）；
  F8 证据无契约（形式与产物状态无绑定，评审结论回指不到产物）；
  F9 归档无机械校核（未勾仍归档，归档后回改冻结记录）。
  另 M2 要求收尾评分指名执行器与门包，现状 rubric 只说「由对应岗位
  打分」，执行者因此自拟 prompt。

evidence:
  - 2026-10-10 一次复杂档交付：8 个交付面在共享契约未冻结、无样板的
    情况下并行铺开，中途共享签名漂移，≥2 个单元报同一类类型错误；
    评审全部集中在收尾一次做完；归档时 4 项未勾仍通过（--yes），
    归档后补正记录。
  - 同次交付的证据散落（截图、命令输出、断言脚本各自为政，
    未绑定产物状态），评审结论无法回指到具体产物版本。

pattern: |
  执行段把「契约、证据、状态」当作自然产物而非可机械核对的
  交付物；并行与收尾都因此依赖执行者记忆与自觉。

proposed_change: |
  仅改 taskflow（SKILL.md + 两份 references），加执行段脊梁：
  1) SKILL.md「实现者输入」：命中门包的交付类别 MUST 携带
     契约文件指针 + 门包 + 证据要求，缺一不得派发。
  2) SKILL.md「并行执行」：新增「旗舰先行」（代表面全量 + 过门包
     必载评审后才铺开，兼作样板）与「同类失败升级」（≥2 单元同类
     失败判契约/计划缺陷，停并行回 design）。
  3) SKILL.md 新增纪律节「收尾机械校核」：归档前逐条核对子 change
     全勾 + validate 通过 + 降级无 pending + findings 全有 disposition
     + 证据与产物状态一致；禁止 --yes 掩盖未勾、归档后不可回改。
     收尾骨架同步加一条校核 checkbox。
  4) references/delivery-quality-loop.md：新增「契约前置 / 旗舰切片 /
     门包叠加」与「增量评审（含 disposition）」；证据段补状态绑定、
     覆盖边界、工具不可用替代。
  5) references/acceptance-rubric.md：打分 MUST 经 role-based-reviewer
     结构化调用、角色按门包表、可自动化门失败封顶、未覆盖按降级计、
     复杂档 SHOULD 异源。
  追加契约测试锁定上述关键句。

expected_improvement: |
  并行只在契约冻结与样板验证后发生；同类失败按契约缺陷一次性修复；
  评审按切片增量推进；证据可回指产物状态；归档前机械拦住未勾状态；
  收尾评分执行器与门包绑定，不再由执行者即兴定义标准。

risk: low
