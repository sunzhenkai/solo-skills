skill: taskflow

problem: |
  SKILL.md「### 并行执行」节只约束子代理侧（每子代理领一个单位、
  不勾 driver 项、只改自己范围），缺主会话侧规则：
  主会话在并行飞行中修改共享面（shared 组件签名/共享类型/编排文件）
  或补写已分配给子代理的文件时，无即时广播要求，子代理会按旧契约
  继续，产出一批基于过期契约的错误。

evidence:
  - 2026-10-10 一次真实并行委派（3 个子代理）中主会话修改共享组件
    签名，经 agent://all 广播后各子代理按新契约继续，避免成片类型
    错返工；未广播即构成这类返工。
  - 同次委派中主会话补写已分配给某子代理的文件，立即定向广播通知
    其收敛范围，未产生文件冲突。

pattern: |
  并行子代理飞行期间，「共享面变更」是双向事件：子代理只读自己的
  范围，但主会话仍可写共享文件与编排文件；任何主会话侧写入若不
  即时广播，等同于悄悄改写子代理的环境。

proposed_change: |
  仅改 SKILL.md「### 并行执行」节：在主会话职责段落后追加两条
  主会话侧协调纪律（原文新增，不改既有条目）：
  1) 改共享面必广播：修改 shared 组件签名/共享类型/编排文件等
     子代理会读会引用的文件前，立即 write agent://all（或定向
     write agent://<id>）广播：改了什么、影响哪些子代理、其范围
     是否调整；收到广播的子代理按修正后契约继续，不视为打断。
  2) 补写已分配文件前核对范围：动手写文件前先对照派发分配表确认
     不在任一在跑子代理的范围内；已写入则立即定向通知该子代理
     收敛其范围。
  并追加契约测试锁定新规则关键句。

expected_improvement: |
  子代理产物不再基于过期契约返工；主会话补写不再与子代理撞文件；
  广播成本一次写消息，远低于返工与合并冲突成本。

risk: low
