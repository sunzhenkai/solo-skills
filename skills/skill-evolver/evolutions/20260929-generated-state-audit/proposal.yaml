skill: skill-evolver
patch: 20260929-generated-state-audit
mode: update
risk: medium
status: proposed

problem: >
  进化状态由执行者在收口那一刻手写，且只有「是否晋升」二值。两个缺陷都在同一轮全量核查中现形：
  一是该更新的字段没人回去更新——候选稿内容被后续合并吸收落地了，proposal 仍停在 proposed，
  另一条目连收口记录都没有，于是「早已落地」与「无人认领」在盘上完全同形；
  二是二值表达不了真实生命周期——一条 patch 的内容曾被应用、四天后又被后续架构决定整段删除，
  此时它的文本落地率是 0%，且今天仍能干净地反向 apply，所有静态判据都指向「忘记应用」，
  只有 git 历史能区分。

evidence:
  - 一轮 181 条目（146 patches + 35 evolutions，跨 6 仓）全量核查：3 条内容确已落地但缺收口记录，
    其中 2 条的落地时刻要靠 git 考古才能复原
  - 同轮 1 条 patch 静态判据全票误判为「未应用」：文本覆盖率 0/5、正向 apply 干净，
    而 git log -S 显示它 2026-09-25 被引入、2026-09-29 被另一次架构拆分移除
  - 覆盖率 <10% 的 28 条 patch 逐条用 git 判据复核，「从未进入历史」为空集——即漏应用的判据必须是历史，不是文本
  - result.md 状态词汇实测只有两种取值（applied 121 / failed 2），无「应用后被取代」的表达位

pattern: >
  状态应由可验证事实生成，不应由执行者手写；一次进化的生命周期是四态而非两态：
  未应用 / 已应用 / 已应用后被取代 / 已否决。可机器判定的唯一判据是 git 历史（内容是否曾进入生产路径、
  现在是否还在），文本比对与 apply 检查都会把「已应用后被取代」误判成「未应用」。
  因此正文要同时补三件事：落地即写证据、补状态词汇、加一层不依赖人记得写的对账。

proposed_change:
  1. 「4. Patch Skill」：晋升/应用那一刻必须在收口记录写 applied-at，
     格式为「ISO 时间 + 仓库名 + commit + subject」；拿不到 commit 就不准写 applied
     （改为 pending-commit 并说明原因）。现稿只规定目录与文件，不规定证据。
  2. 「6. Promote or Reject」：状态词汇补 `superseded`（内容曾落地、后被后续改动取代或移除）；
     新增硬规则——候选稿被后续合并吸收时也必须写 decision.md 并指向吸收它的那一轮，
     禁止把状态留在 proposed。现表只覆盖 promote / reject 两种结局。
  3. 新增「7. 状态对账」：规定定期（或每次收口前）跑仓库侧 `make skills-evolution-audit`，
     它对每个 patch/evolution 用 git 反查四态并与声明的 status 对账，只输出不一致项；
     正文规定「audit 报不一致时只改记录，不动生产稿」。脚本本体属仓库工具
     （确定性取数，不解析自然语言），不进 skill 正文。
  4. 「5. Evaluate」补一条判据禁令：判「是否遗忘」只能依据 git 历史命中，
     不得以文本覆盖率或 apply 检查单独定论（两者只作辅助信号）。
  5. 「边界」明确否决「晋升后把 patch 移入单独目录」：目录位置不是状态载体，
     移动会切断 eval/decision 里对 patches/<slug> 的引用链，且无法表达 superseded。

expected_improvement: >
  「已落地」与「无人认领」不再同形：不一致由脚本暴露，而非依赖下次有人好奇去考古；
  「应用后被取代」不再伪装成「忘记应用」，避免据此重放一份早已否决的改动；
  收口记录自带 commit 证据，定性从分钟级 git 考古降为读一行。

risk: medium

risk_notes:
  - 新增两条硬规则（无 commit 不准写 applied、被吸收也要写 decision.md），
    会回溯性地把当前部分既有条目判为不合规范；不改触发条件、不扩权限、不动安全约束。
  - 「无 commit 不得写 applied」在非 git 工作区、或改动尚未提交时会卡住收口：
    必须配套显式的 pending-commit 取值，否则执行者只能违规跳过或写假状态。
  - 依赖一个新脚本。脚本未落地前第 1、2、4、5 项可独立生效（纯记录约定），
    建议先落约定、脚本另做一轮，避免正文指向不存在的 target。
  - 本 patch 只改 skill-evolver 正文；`make skills-evolution-audit` 属仓库工具改动，
    按「仓库优先」惯例另案处理，不夹带进来。
  - 与本 skill「一次会话最多推进一个目标 Skill 的一轮进化」不冲突：本条只到提案，未进 Patch。
