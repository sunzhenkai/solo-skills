skill: task-goal

problem:
  上一轮已把状态机落成 references/state-machine.md 的迁移网格，
  但「查表」仍靠模型自己读 markdown、对齐行列、解读单元格语义——
  分类与迁移这两步仍在模型脑内。本次失败族的另一半根因
  （「重申第几次」「当前状态是什么」靠从对话历史重建）依然成立。

evidence:
  - 2026-09-30 失败原话：「执行者只能自行推导」「重申没有上限」——
    计数与状态重建是模型推理，不是机械读取。
  - 上一轮 goal-state-machine 晋升后，网格本身是数据；
    不跟着配一个读数据的脚本，是把「数据驱动」停在半路。

pattern:
  必须被强制的状态迁移，写成数据 + 读数据的脚本；
  散文只做解释，不做约束。

proposed_change:
  新增 scripts/goal_transition.py（仅 Python 3 标准库）：
  - 输入：--state {执行中|已停|已交接|已完成} --event <11 种事件名>
    --autocontinue-count N（已停 × goal 自动续跑时必填）
  - 输出 JSON：{next_state, allowed_actions, reply_shape, note}
  - 未定义组合输出 {next_state: null, note: "未定义组合 → 走无进展轮"}
  - 查表数据从 references/state-machine.md 的网格行解析，不另存副本
  - 附带 unittest：覆盖每个非空格 + 至少 3 个未定义组合 + 计数边界
  SKILL.md「触发」节末尾把「查网格」改为「调用 scripts/goal_transition.py」；
  正文其余不变。tests/ 补契约断言脚本存在、可运行、输出含 next_state。

## 晋升落地调整（promote 阶段补充）

- 归档测试副本改名为 `tests/goal_transition_test_snapshot.py.txt` 退出 pytest 收集，
  避免与生产 `tests/test_goal_transition.py` 发生 module clash 并避免归档副本
  导入路径指向不存在的归档 scripts/。生产稿测试保持 `tests/test_goal_transition.py`。

expected_improvement:
  状态迁移从「模型读散文+读表再推理」变成「脚本输出」；
  分类与计数被强制，网格改一行脚本行为跟着变，不需要再改脚本。

risk: medium
