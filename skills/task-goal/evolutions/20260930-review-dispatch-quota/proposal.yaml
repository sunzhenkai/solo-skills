skill: task-goal

problem:
  审阅节的「派审提示词」要求只规定内容（完成判据 / 边界 / 上轮 P0P1 / 完成程度），
  未规定预算与证据纪律：无约束的派审单轮消耗可达 ~880k subagent tokens，并触发
  并发 / 配额墙使评审者连续派不出（审阅排队）；审阅对象已有落盘文件时，提示词内
  重贴全文造成核对轮的重复消耗。

evidence:
  - 2026-09-30 同日 5+ 次真实派审：首轮无预算约束的三角色并行派审 ~880k tokens，
    product 角色连续两次派发失败（并发限额 / 配额超限），被迫合并单评审者重派
  - 同日后续 4 轮派审显式携带「工具调用上限 + 只读文件清单 + RoleBrief 精简输出」，
    全部一次成功，单轮降至 ~20k–210k tokens
  - 审阅对象落盘后，核对轮仅需 1–2 次工具调用（读文件核对）

pattern:
  派审提示词的「配额纪律 + 证据落点」是派审一次成功率与成本的决定因素。

proposed_change:
  在「审阅」节派审要求段末尾追加一条可执行要求：派审提示词 MUST 声明配额纪律
  （工具调用上限 / 只读范围清单 / 结论输出格式），审阅对象已落盘时读文件核对、
  不重贴全文。

expected_improvement:
  派审一次成功率提升；审阅成本降一个量级；「审阅派不出」（资源等待）触发减少。

risk: low
