skill: task-goal

problem:
  「同一验证连败两次」的连败判定挂在外部条件「且没有新事实」上，
  而事实新旧由执行者自判：想继续的总能产出「新事实」重置计数
  （实质是同一假设的重复失败），想停的提前停。度量的应该是
  假设空间的消耗，不是事实数量——与已修的审阅连败缺陷同构
  （按轮次/外部条件计数，不按问题身份计数）。

evidence:
  - 2026-09-30 全族审计模式 1 弱实例：该退出点在真实运行中要么
    永不触发（总有新事实）、要么触发时机武断，两种方向都出现过
    症状（空转 / 过早停）；审阅循环的同构缺陷已被两个真实 case
    证实并修复（20260930-review-loss-streak）。
  - task-goal 既有「同一验证连败两次」是族内唯一仍按外部条件计数
    的封顶规则。

pattern:
  封顶规则的计数单位必须是「可判伪的解释（假设）」而非「事实」：
  事实可以无限增生，假设空间有限；把假设空间显式化才有可审计的
  收敛保证。

proposed_change:
  仅改 SKILL.md 退出点「同一验证连败两次」定义一条，标签与其余
  章节不动，追加契约测试：
  1) 连败按「同一假设下的连续失败」计：假设 = 对失败原因的可
     判伪解释，首次失败写进验证记录。
  2) 换假设必须写下新假设与旧假设的判伪差异，重新计数——防换皮
     假设无限续命。
  3) 假设空间封顶：同一验证累计假设 3 个仍失败 → 停，不再换假设。
  4) 删除「且没有新事实」外部条件。

expected_improvement:
  合理的排查深挖（真换假设）不再被误停；同一假设的原地打转被
  硬封顶；验证记录里连败与假设数逐条可查，退出判定可审计。

risk: low（收紧可审计性，不放宽任何安全边界；总尝试上限从
「2 次+自判新事实」变为「3 假设 × 各自连败」的显式封顶）
