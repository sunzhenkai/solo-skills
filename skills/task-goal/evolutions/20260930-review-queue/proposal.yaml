skill: task-goal

problem:
  审阅派不出 / 审阅没有结论直接 `已停` 等用户——但审阅基建不可用
  （异源端点配额墙、会话无响应、skill 读不到）是资源问题，用户
  修不了配额墙；正确的解是时间（重试）或降级（已有 subagent 档），
  不是授权。停下等一个修不了它的人，是类别错误；且已停期间白名单
  不含派审，端点恢复后自动续跑轮也无名分重试。

evidence:
  - 2026-09-30 真实 case：异源端点耗尽（一个 Endpoint 配额墙、
    一个会话无响应、一个回吐启动横幅），design 评审被迫改由本机
    subagent 承担，已在前提记「异源端点耗尽」——该形态真实发生。
  - 同日全族审计模式 3（用户缺席无降级路径）的 goal 层实例。

pattern:
  资源等待与授权等待混用同一「已停」形态与路由文案；恢复触发
  只有用户输入一种，而这类等待的恢复触发是端点可用性。

proposed_change:
  仅改 SKILL.md 三处 + state-machine.md 一格 + suspension.md
  白名单一句，追加契约测试：
  1)「审阅」节新增「审阅排队」段：按表选定方式派不出时先按既有
     规则换档；仍派不出进入排队——状态保持执行中/已交接，当轮做
     非依赖审阅的工作或只读白名单，回复写明排队项与重试时机，
     下一轮（含自动续跑）重试；连续两轮重试仍派不出、或无排队
     工作可做 → 已停，退出点「审阅派不出」，路由写「等端点恢复」，
     与授权等待分开呈现。
  2)「审阅没有结论」（派得出、无可用结论）不排队，按既有规则停。
  3) 两个审阅类退出点的已停期间，自动续跑轮允许重试派审（审阅者
     只读），派审成功按网格审阅收敛/未收敛格走——恢复触发从
     「仅用户输入」扩为「用户输入或端点恢复」。
  4) 网格已停×goal 自动续跑格与 suspension 白名单同步该例外。

expected_improvement:
  端点墙从「停下等用户」变为「排队重试，最多两轮」；已停期间
  端点恢复即自动恢复，不消耗用户交互；真不可恢复时 blocked 摘要
  如实写「等端点恢复」而非求授权。

risk: medium（已停期间新增一种允许动作；审阅者只读约束不变）
