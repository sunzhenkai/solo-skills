skill: task-goal

problem:
  goal 模式下退出点机器不丝滑的三个病灶：
  1) 降级确认一刀切——不影响完成判据与交付面的降级（如批次策略、
     顺序的诚实声明）与范围性降级同走「pending 不清零不开工」硬门，
     且实现中新降级逐次停机，一次 goal 可能停 2-3 次，全停在用户
     缺信息（零实物）的时刻；
  2) 授权按句式逐字匹配——用户说「行」「按你说的办」不命中授权
     形状即重申仍停，「被拒绝的继续」是最高频摩擦；
  3) 无进展轮兜底的括号文字（「用户消息、审阅结论、环境新事实
     均不算」）与意图相反，字面执行会把用户回复轮判成无进展轮。

evidence:
  - 2026-09-30 两个真实复杂档 goal blocked：A/B 未分级的降级表
    （10 条与 8 条 pending）是直接死因之一；其中已明确存在「范围与
    判据都不缩」的条目仍参与停机。
  - 2026-09-29 真实用户纠正（experience/failures）：等待呈现形状
    不对被迫纠正一次；授权句式匹配加重解除成本。
  - 2026-09-30 全族审计：suspension 五元组已定义「非依赖面」但
    停机仍为全局；本提案是 goal 层的配套（降级分级 + 意图授权），
    下游接入属后续各 skill 进化轮。

pattern:
  退出点的设计假设是「用户在场、说标准句、停就全停」；goal 模式
  实际形态是「用户缺席、说人话、阻塞应局部」。三个假设全错位。

proposed_change:
  一个 evolution、三项联动改动（SKILL.md + 三份 references + 契约测试）：
  1) 降级 A/B 分级【risk: high，单列】：
     - 每条降级定级写进表：A 类 = 使完成判据不成立或收窄交付面
       （拿不准一律归 A）；B 类 = 完成判据与交付面都不缩，只是
       交付方式/顺序/批次的诚实声明，且必须写回滚说明。
     - A 类维持原硬门（pending 不清零不开工不交接，confirmed 仍
       只有用户能写）。
     - B 类 pending 走审阅临时确认（收敛即 provisional，不停机），
       到用户在场点（真人门、收口）集中追认：追认改 confirmed，
       否决按回滚说明处理后回退出点重定级。
     - 完成门：无 pending 且无 provisional（B 类已全部追认）。
     - 确认状态字段扩为 confirmed | provisional | pending。
  2) 复述生效（意图授权）：
     - 用户回复按意图判定是否命中已列授权项，命中即当轮复述
       「理解为授权 <项>，若无纠正即生效」并按授权格走；下一轮
       纠正按用户改向处理。
     - 不可逆动作（未点名的危险操作、线上动作）除外：仍逐字点名。
     - 单独「继续」仍不算授权。
  3) 无进展轮括号修复：两处「均不算」→「任一到达即算新输入」。

expected_improvement:
  不缩判据的诚实声明不再阻断开工；一次 goal 因降级最多停一次且停在
  有实物的追认点；用户说人话即可解除等待（不可逆动作除外）；无进展
  轮字面与意图一致。A 类硬门与「confirmed 只有用户能写」原语义保留。

risk: high
