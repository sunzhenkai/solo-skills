skill: task-goal

problem:
  审阅核对按「写入轮次」封顶：第二次核对「仍有未消失的，或又冒出新的
  P0/P1」一律「不再写入」。但修复行为本身会引入新 P1（改写方案文字必然
  产生口径失配），而新 P1 分两类——残留（同一条没修掉）与回归（本轮
  改动引入）。封顶规则不区分二者：修得好（旧账全消）与修不好（同条赖着）
  同判死刑；执行者每改一轮都在烧掉唯一的修改通道，只能 blocked 等用户。
  同时与「同一验证连败两次」退出点不对称：实现阶段承认连败语义，
  审阅阶段没有。

evidence:
  - 2026-09-30 两个真实复杂档 goal blocked，同一结构：初审 P0/P1 全部核到
    「已消失」、零驳回；卡死的全是末轮改写自己引入的回归条（一处 5 条
    新 P1，另一处 2 条），reviewer 改法逐条已给，但「不再写入」关闭了
    唯一通道，第三次自动续跑后 blocked。
  - 2026-09-30 同族审计：task-delivery 修复循环「每个窄切片最多两轮」
    同款不区分连败与新伤；task-explore decide↔driver 快照不同步是其
    对偶缺陷。缺陷在族内复发，模式稳定。

pattern:
  「修复-核对」循环以轮次封顶、以「有无新意见」判死刑，在意见密度高的
  复杂档下必然触发：写入轮次耗尽时旧账清零、新账全是自己造的。稳定的
  判别缺失是：没有按 finding 身份（同一问题 vs 新问题）计数。

proposed_change:
  仅改 SKILL.md 两处（核对网格 2-3 条、退出点「审阅不通过」定义），
  其余章节不动：
  1) 核对单位从「轮」改为「条」：每条 P0/P1 按语义指纹跟踪（指向同一
     判据/步骤/退出 + 同一缺陷实质，只换写法算同一条），核对结论分
     三类——已消失 / 仍在 / 新增（本轮改动引入的回归）。
  2) 收敛条件不变：全部已消失且无新增 → 收敛。
  3) 封顶条件改为「连败」：同一条连续两轮核过「仍在」→ 已停，
     审阅不通过；新增条写入后继续核对，不占旧条连败数。
  4) 恶化闸：单轮新增条数 ≥ 上轮已消失条数（修复在恶化）→ 已停，
     审阅不通过，写明回归账。
  5) 「不再写入」保留已停语义（已停期间不改方案等授权），删除轮次语义。
  6) tests/ 补契约断言：SKILL.md 含「连败」「恶化闸」语义、核对仍以
     「已消失/仍在」判定、退出点封闭集合不变。

expected_improvement:
  两个真实 blocked case 在新规则下可解：旧账全消 + 新账全是回归（未达
  恶化闸）→ 继续写入核对而非焊死；真正的失败形态（同一条修不掉、修复
  在恶化）仍封顶。审阅不通过的判定更准而非更松。

risk: medium
