skill: task-goal

problem:
  「执行中升档」到复杂档的路径是隐性二次停机：升档本身不停
  （改已交接，合理），但复杂档立刻要求质量画像与降级表，原
  简单/中等方案没有——画像缺失是 P0、降级 pending 停机，
  用户体验为「升级即停」，且停点信息量最低（还没有任何复杂档
  形态的实物）。

evidence:
  - 2026-09-30 退出点整体评审第 8 条：升档路径自洽但体验是升级
    即停；Phase 1 的 A/B 分级已把降级侧解掉，画像侧缺口仍在
    （正文要求缺字段 P0 完善中，但没有规定升档场景下画像素材
    从哪来、何时补）。

pattern:
  档位要求的产物（画像）只在产方案阶段有定义来源（上游
  task-wizard 或自产摸底）；升档是中途变更档位，没有对应的
  画像补给路径，落到「理解不够/降级未确认」的停机兜底。

proposed_change:
  仅改 SKILL.md「执行中升档」定义一条：升到中等维持原句；升到
  复杂增加画像补给路径——当轮以已有摸底与已验证步骤为素材补
  质量画像草稿与显式降级表（A/B 定级），按审阅节过审（完善中，
  不改代码），A 类回确认门、B 类审阅临时确认，升档不因画像缺失
  直接停机；收敛后按复杂档交接。追加契约断言。

expected_improvement:
  升档从「升级即停」变为「补画像→过审→衔接」的连续路径；停机
  只发生在 A 类降级确认这一个实质等待点。

risk: low（升到复杂仍必过审阅，画像质量门不降，只补素材来源
与路径定义）
