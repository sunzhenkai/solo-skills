skill: task-goal

problem:
  blocked 交接摘要的「下一步」没有排序规则：多条退出点叠加时
  （真实 case：降级未确认 + 审阅不通过，5 大节 + 10 条降级 +
  5 项回归），用户回来要读完全部才能动手，解除成本高——哪些
  授权句各自解掉什么、哪句性价比最高，摘要不回答。

evidence:
  - 2026-09-30 真实 blocked case 的交接摘要：推荐句「降级全部接受，
    按审阅改法继续」实际同时解掉两个退出点，但摘要靠读者自行
    拼出这个事实；「仍按此方案执行」的替代语义与风险附注埋在
    第五节末尾。

pattern:
  停止的解除成本 = 用户读完摘要并选对句子；多退出点叠加时无
  排序规则，成本随叠加数线性增长。

proposed_change:
  仅在 references/suspension.md 的 blocked 段追加「最小解除集」
  排序规则：一句授权解掉最多退出点的排最前并写明解掉哪几个；
  逐条解的排后；多等待项先给最小解除集再给完整清单。追加契约
  断言。

expected_improvement:
  用户回来第一眼看到性价比最高的授权句及其覆盖面；解除交互
  从「读全文选题」变为「念第一句」。

risk: low（纯呈现规则，不改任何判定）
