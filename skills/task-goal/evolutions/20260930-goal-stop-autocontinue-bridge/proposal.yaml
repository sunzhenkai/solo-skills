skill: task-goal

problem:
  「授权」节只定义了「重申仍停」，未定义 goal 自动续跑（非用户回复）这一输入形态：
  既无停止期间的工作边界，也无重申的终止条件。goal 模式遇无人在线时，
  执行者要么空转重申，要么自行推导越界动作。

evidence:
  - 2026-09-30 一次 goal 复杂交付闭环：同一退出点被自动续跑 4 轮，执行者重申 3 轮后
    第 4 轮自行标记 blocked；约 98 分钟零实现产出。
  - 同轮中执行者自推导完成 6 项只读环境取证，规则中无名分。
  - 2026-09-29 同族失败（等待被登记成任务）已由 goal-wait-protocol 补丁修复，
    证明该族问题重复出现且可被规则消除。

pattern:
  「已停」规则缺少自动续跑下的桥接：允许做什么、何时停止重申。

proposed_change:
  在 task-goal「授权」节末尾追加一段（不改既有句、不删封闭授权集合）：
  1) 已停期间允许且应做只读环境查证、外部原文取证与证据固化；
     禁止写交付代码、改完成判据/步骤/降级表、commit/push/部署。
  2) 同一退出点被 goal 自动续跑连续第三次且仍无用户输入时，
     标记 goal blocked 并给交接摘要，不再第四次重申。
  3) 重申与 blocked 交接均不得写成选项列表。

expected_improvement:
  无人在线的 goal 运行不再用重申烧轮次；等待期转化为已验证的环境事实；
  循环以可 resume 的 blocked 状态收尾并附交接摘要。

risk: medium
