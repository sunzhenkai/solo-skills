skill: task-goal

problem:
  状态机（四状态 × 各类输入）散写在授权、退出点、纪律、写完之后四处散文里，
  执行者每轮要靠推理从对话历史重建状态、分类输入、找规则、做迁移——四步全靠模型。
  「已停」遇到封闭规则没覆盖的输入形态（goal 自动续跑、以及未来任何新形态）时，
  只能靠临场推导，轻则空转重申，重则自推越界。

evidence:
  - 2026-09-30：goal 自动续跑下同一退出点重申空转四轮（98 分钟零产出）；
    已由 goal-stop-autocontinue-bridge 补丁修了该实例。
  - 2026-09-29 同族失败（等待被登记成任务）也已由 goal-wait-protocol 补丁修复。
  - 两个补丁都是「缺一个格子补一段散文」——散文继续增殖，下一个未覆盖的
    输入形态仍会漏；没有枚举输入、没有计数载体、没有收敛证明。

pattern:
  「已停」类等待状态与输入形态组合被遗漏时，执行者即兴处理；
  补丁逐个补格子而不枚举格子，问题一族一族地复发。

proposed_change:
  两处新增 + 四处接入句（不改既有规则语义、不删既有句子）：
  1) 新增 references/state-machine.md：
     - 事件封闭枚举：用户授权 / 用户继续 / 用户改向 / goal 自动续跑 /
       审阅收敛 / 审阅未收敛(P0·P1) / 退出点命中 / 判据成立 / 步骤或checkbox推进 /
       外部新事实到达 / 用户补充信息。
     - 聚焦网格：已停行穷举全部 11 事件（问题集中区）；执行中、已交接、
       已完成只列有迁移的事件。blocked 定义为「已停」的交接形态，
       不是第五状态。
     - 每格：下一状态 + 允许动作 + 回复形状。
  2) SKILL.md「授权」节末尾追加「无进展轮」兜底：状态与退出点与上轮
     完全相同、且无新的外部输入时，禁止原样重复——做已列名只读工作，
     否则按自动续跑第 3 次处理：blocked 交接。
  3) SKILL.md 起手/审阅/写完之后/退出点节各加一句接入语，指向
     references/state-machine.md，并明示「网格与无进展轮有出入时以正文为准」。
  4) tests/ 补契约断言：reference 文件存在；11 个事件名全部出现；
     四状态各成一行；已停行非空格数 ≥ 11；SKILL.md 含「无进展轮」与
     state-machine.md 引用。

expected_improvement:
  新增输入形态时只需查表——表里没格子就走兜底，兜底最坏结局是 blocked
  交接而非空转；输入分类从「通读散文再推理」变为「对照枚举」；
  网格覆盖率可被测试断言，不再靠运气。

risk: medium
