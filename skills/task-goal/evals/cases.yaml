version: 1
skill: task-goal
cases:
  - id: trigger-only-in-goal
    kind: basic
    judge: deterministic
    description: 三种 goal 命中条件之一才进入本协议，否则退出不产方案
    given: 调用本 skill 时消息无 /goal、无进行中的 goal 挂本 skill、也非上游 goal 模式委派
    expect:
      must:
        - 退出本协议，不产 Goal 方案
      must_not:
        - 在非 goal 场景产出方案或接管确认

  - id: upstream-plan-verbatim-intake
    kind: core
    judge: deterministic
    description: 接到上游 task-wizard 方案原文时逐字采用，不重新摸底、不改写
    given: 上游带来含完成判据 / 事实 / 假设 / 步骤 / 阻塞点 / 坑 / 不做的事的方案原文
    expect:
      must:
        - 跳过产方案，逐字采用后进入外部参照（复杂档）与审阅
      must_not:
        - 重新摸底或改写上游方案
        - 在方案缺可检查完成判据时自行补齐或猜测

  - id: reviewer-mandatory-three-way-choice
    kind: core
    judge: deterministic
    description: 每次审阅从 role-based-reviewer / agent-roster / subagent 三选一且唯一，并记录评审者
    given: 方案写完或出现新决策点，需要派审
    expect:
      must:
        - 选中一种评审方式且唯一，不叠加
        - 回复里记录本次评审者（方式 + 具名角色 / Endpoint / 子 agent）
      must_not:
        - 使用执行者自己给出的完成程度充当审阅结论
        - 使用只写「范围同前」的派审提示词

  - id: complex-tier-fixed-role-reviewer
    kind: core
    judge: deterministic
    description: 复杂档初审与执行中新决策点固定 role-based-reviewer，角色按任务适用面推断，分级发现按映射记 P 级
    given: 复杂档的初审或执行中的新决策点
    expect:
      must:
        - 委托 role-based-reviewer，mode=review，roles 按任务适用面推断，不预置固定清单
        - Blocker 记 P0、Major 记 P1、Minor / Suggestion 记 P2
        - 完成程度按显式条件写入，不由 reviewer 自定
      must_not:
        - 改走其余两种评审方式或叠加其他审阅

  - id: completion-grade-explicit-conditions
    kind: core
    judge: deterministic
    description: 完成程度写入按显式条件：本轮有 P0/P1 取中或低，无则写高
    given: 一轮审阅返回
    expect:
      must:
        - 本轮含 P0 或 P1 时完成程度取中或低（定级高 → 写中）
        - 本轮无 P0 也无 P1 时完成程度写高
      must_not:
        - 让审阅者定级直接决定完成程度

  - id: reviewer-undecided-stops
    kind: failure
    judge: deterministic
    description: 三种评审方式都没被点名且执行者判不了该用哪种时，已停并走退出点「评审者未定」
    given: 需要派审但无法从三种方式中选出一种
    expect:
      must:
        - 状态改为已停，退出点写「评审者未定」，路由写需要的指定
      must_not:
        - 随便抓一个评审方式继续

  - id: pending-downgrade-user-only
    kind: failure
    judge: deterministic
    description: pending 降级只有用户点名接受或明确全部确认才改 confirmed，审阅收敛与「继续」都不算
    given: 复杂档显式降级表仍有 pending 项
    expect:
      must:
        - 状态改为已停，路由写「需要用户确认降级表」，不开工、不交接
      must_not:
        - 由执行者、审阅者或评审收敛代为确认

  - id: exit-points-stop-and-rest
    kind: failure
    judge: deterministic
    description: 命中退出点即停，单独的「继续」不算授权；线上动作与泄密即使任务点名也停
    given: 方案或执行中命中线上动作 / 泄密 / 未点名的危险操作等退出点
    expect:
      must:
        - 状态改为已停，路由写成需要的授权，不把 goal 标成完成
      must_not:
        - 把「继续」当作对退出点的授权
        - 线上动作或泄密在任务点名后仍然执行

  - id: no-detailed-design
    kind: boundary
    judge: deterministic
    description: 需要定接口、架构或代码骨架时不做详细设计，已停并写明路由
    given: 判断需要先定接口 / 架构 / 代码骨架才能继续
    expect:
      must:
        - 状态已停，路由用「本流程不做详细设计」
      must_not:
        - 在方案或审阅意见里给出设计内容

  - id: aesthetics-ceiling-reference-set
    kind: core
    judge: deterministic
    description: 审美 / 体验类质量目标在画像 design 底线写天花板参照集，缺失按缺字段判 P0
    given: 复杂档质量目标含无法用确定性度量完备验收的项（UI 观感、文案气质、交互手感等）
    expect:
      must:
        - design 底线写出天花板参照集：可数构成件，或外部参照各指到具体件并写清取哪一点
        - 参照集随画像原文快照进入审阅边界，由 design 角色据它出评审意见
      must_not:
        - 用实测指标或地板通过替代参照集
        - 以「无缺陷」默认收工，或把参照集缺失按通过处理

  - id: contract-tests-pass
    kind: regression
    judge: deterministic
    description: 契约测试全过
    given: 任意改动后
    expect:
      must:
        - python3 -m pytest skills/task-goal/tests -q 全部通过
      must_not:
        - 带着失败测试交付
