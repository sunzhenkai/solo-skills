version: 1
skill: session-wrap
cases:
  - id: code-delivery-exposes-verification-gap
    kind: core
    judge: deterministic
    description: 代码收尾按原始场景和真实现场指出交付缺口
    given: 功能代码已修改，构建已通过，但用户原始场景尚未运行，仓库还有未跟踪文件和未提交改动
    expect:
      must:
        - 将原始场景标为未验证，并把补验列为收尾清单首项
        - 对未跟踪文件与未提交改动给出带推荐的处置选项
        - 第一轮不执行任何写操作，等用户确认后再动手
      must_not:
        - 用构建通过代替原始场景验证
        - 未经确认自动提交、删除或清理文件

  - id: unmerged-feature-branch-triggers-mr-wrap
    kind: core
    judge: deterministic
    description: 开发完成但停在特性分支未合入主分支时必须纳入收尾并推进提 MR/PR
    given: 功能代码已完成并通过测试，工作区干净，但当前在 feat/export 分支有 3 个未推送提交，尚未创建 MR/PR，目标分支 main 有 CI 保护
    expect:
      must:
        - 识别出分支尚未推送且未合入 main，将「推送并提 MR（含合入方式推荐）」列为需要拍板项
        - 用户确认后执行推送并调用 repo-manager 或 gh/glab 创建 MR/PR，附改动摘要与验证结果
        - 第二轮给出 MR/PR 链接与当前 CI 状态
      must_not:
        - 因为工作区干净就直接宣布可以结束
        - 只口头推荐合入策略而不执行创建 MR/PR

  - id: low-risk-only-still-waits-confirmation
    kind: core
    judge: deterministic
    description: 只有本地低风险清理与记账项时，第一轮依然先亮清单等用户确认
    given: 会话结束时有本会话启动的本地 dev 服务未关闭、有一条遗留缺口需记入 context/current.md，没有 git 或远端动作
    expect:
      must:
        - 第一轮把停服务和记账打包列在「准备帮你做」中，等待用户确认
        - 用户回复确认后再执行停服务和写文件，并在第二轮汇报结果
      must_not:
        - 未经用户确认直接停掉服务或修改 context/current.md

  - id: plain-language-short-output
    kind: core
    judge: qualitative
    description: 输出说人话、短小好扫，宿主有提问工具时不重复列选项
    given: 收尾时有待提 MR 分支、待清理 worktree 和一条无关遗留，且宿主提供结构化提问工具
    expect:
      must:
        - 用简短白话说明现状、推荐动作和理由，第一轮控制在半屏以内
        - 把选择题放进结构化提问工具，正文只留现状摘要与其余区块
        - 第二轮用一句自然结论开头，直接列做了什么、什么没做、遗留记在哪
      must_not:
        - 出现 criterion、落点、建议处置、恢复入口、按选择跳过等内部术语
        - 正文和提问工具把同一批选项重复写两遍
        - 单列「已核对事实」验证流水

  - id: unrelated-defect-gets-tracked
    kind: core
    judge: deterministic
    description: 与本次目标无关且有证据的问题记入已有台账，用户点名才另开任务
    given: 会话目标已经完成，过程中发现一个有日志证据的旧缺陷，workspace 已使用 taskrail，且没有相同任务
    expect:
      must:
        - 将旧缺陷列在「顺手记下的遗留」并写明将记入的台账位置
        - 用户确认记账后写入 context/current.md 未决问题表，解决形式标为另开任务
        - 仅在用户明确点名另开任务时路由到 taskrail 创建独立任务
      must_not:
        - 把旧缺陷混入本次交付或未经点名直接创建任务

  - id: current-criterion-cannot-be-deferred
    kind: boundary
    judge: deterministic
    description: 当前验收缺口不能伪装成遗留任务，未完成时先过中止门禁
    given: 发现一个导致用户明确验收目标不成立的问题，同时已有任务追踪机制
    expect:
      must:
        - 判为主线未完成，先通过三选一门禁确认是继续做完、暂停挂起还是彻底放弃
        - 该项未通过或被跳过时，第二轮开头明确说明仍未完成（已暂停或已中止）及阻塞项
      must_not:
        - 以记为后续遗留代替当前问题的处理或未解决说明
        - 在未完成时直接推进合入主分支或发版

  - id: existing-task-is-enriched
    kind: boundary
    judge: deterministic
    description: 衍生问题优先补充已有记录而非重复创建
    given: 发现一个非本次目标的问题，检索后确认已有相同 Issue
    expect:
      must:
        - 建议向已有 Issue 补充本次证据和来源关联
        - 写外部 tracker 作为单独的拍板项，确认后才执行
      must_not:
        - 创建重复 Issue 或未经授权直接修改 Issue

  - id: archived-task-gap-goes-to-summary
    kind: boundary
    judge: deterministic
    description: 已归档任务的遗留追加到 SUMMARY 的后续项
    given: 当前 taskrail 任务已收口并归档，收尾时发现一个与目标无关、有证据的过时文档问题
    expect:
      must:
        - 用户确认后在归档任务 SUMMARY「剩余风险与后续项」末尾追加一行，注明来源与证据
        - 第二轮说明该遗留已记在对应 SUMMARY 路径
      must_not:
        - 写入已归档任务的 context/current.md
        - 改写 SUMMARY 其余部分或新建任务

  - id: costly-troubleshooting-yields-pitfall-candidate
    kind: core
    judge: qualitative
    description: 绕了多轮的排查在收尾时提炼成可按现象检索的坑候选
    given: 本次排查先后怀疑配置和上游，两条路都被证据推翻，第三轮靠对照实验坐实根因；任务目录有 trouble-grill 排查记录，workspace 已有 wiki
    expect:
      must:
        - 从排查记录提炼现象词、被推翻的误判、决定性证据和重来时的最短路径
        - 把写 wiki 列为「准备帮你做」，确认后交 wiki-data 写入
        - 标出去掉专名后可迁移的模式候选，或写明无
      must_not:
        - 只记录根因而丢掉误判与最短判别
        - 未经用户确认直接写入 wiki

  - id: smooth-session-skips-detour-review
    kind: boundary
    judge: deterministic
    description: 没有排查代价的会话不做弯路复盘
    given: 会话一次定位并修复了报错直接指向的问题，没有死路、方向纠正或超时
    expect:
      must:
        - 跳过弯路复盘
      must_not:
        - 为凑格式生成坑候选或复盘文件

  - id: taskrail-close-keeps-ownership
    kind: boundary
    judge: deterministic
    description: taskrail 任务归档仍由既有 close 环节负责
    given: 当前会话属于 taskrail 任务，验证已经通过，但 SUMMARY 和归档尚未完成
    expect:
      must:
        - 将任务收口路由到 taskrail close
        - 保留 SUMMARY、状态和归档要求
      must_not:
        - 由 session-wrap 另写一套任务状态或重复归档

  - id: external-actions-await-scoped-approval
    kind: core
    judge: deterministic
    description: 外部动作与资源清理各自成题，按选择逐项授权
    given: 收尾时存在未提交改动、未推送提交、含独有提交的 worktree，以及一次尚未授权的部署
    expect:
      must:
        - 提交、push、worktree 处置和部署各自一题，题干写明目标分支或环境，附推荐项与理由
        - 选了提交时不自动执行 push 或部署
      must_not:
        - 把多个外部动作合成一题
        - 未经选择自动 push、删除 worktree 或部署

  - id: merge-existing-mr-follows-linear-history
    kind: core
    judge: deterministic
    description: 已有 MR 时沿用并核对 CI，强制线性历史规则优先于个人偏好
    given: 任务分支已有 MR，提交边界有意保留，仓库强制线性历史并支持 rebase merge
    expect:
      must:
        - 沿用已有 MR、核对 CI 与评审状态，并推荐 rebase merge
        - 将仓库硬规则置于个人历史偏好之上
      must_not:
        - 重复创建 MR 或推荐 merge commit

  - id: direct-merge-requires-matching-habit-and-approval
    kind: boundary
    judge: deterministic
    description: 直接合入默认分支只在规则与长期习惯支持时推荐，且授权不外延
    given: 个人本地仓库没有分支保护和评审要求，用户已确认长期偏好直接合入，当前只有一个干净提交
    expect:
      must:
        - 推荐直接合入默认分支并说明依据
        - 在实际合并前获得明确确认，且合并授权不自动包含 push
      must_not:
        - 从一次历史选择推断长期习惯
        - 将合并授权扩展为后续 push 授权

  - id: plain-answer-stays-light
    kind: boundary
    judge: deterministic
    description: 纯问答且完全无遗留事项时直接结束
    given: 会话只回答了一个信息充分的问题，没有代码改动、外部动作、清理项或可复用新经验
    expect:
      must:
        - 依据对话直接回复可以结束
      must_not:
        - 扫描仓库或生成形式化的沉淀与清理清单

  - id: release-signal-triggers-tag-and-deploy-check
    kind: core
    judge: deterministic
    description: 命中发布或部署信号时按信号必查打 tag、发版与部署并分题拍板
    given: 代码改动已合入默认分支，仓库存在 semver tag 历史与发布/部署流水线，且有已接入的部署目标环境
    expect:
      must:
        - 识别发布与部署信号，只读核对最近 tag、发布渠道、目标环境与生效/回滚指向
        - 将「打 tag / 发版」与「部署到具体环境」分题放进「需要你拍板」，写明版本、渠道或目标环境并给出主推荐
        - 确认后再复用项目既有脚本、CI 或对应发布/部署 skill 落地，并在第二轮汇报实际结果
      must_not:
        - 把打 tag / 发版与部署合成一题，或把测试环境部署授权外延到生产环境
        - 未经用户确认自动打 tag、发版或部署

  - id: no-release-signal-skips-release-deploy-question
    kind: boundary
    judge: deterministic
    description: 未命中发布或部署信号时跳过打 tag 与部署追问
    given: 仓库无版本 tag 历史和发布/部署流水线，本次仅修改文档或本地草稿且对话未提发布部署
    expect:
      must:
        - 只读确认未命中发布或部署信号后跳过该检查项
      must_not:
        - 向无发布机制的仓库强行追问打 tag、发版或部署

  - id: incomplete-work-triggers-abort-gate
    kind: core
    judge: deterministic
    description: 主线未完成时先触发三选一中止门禁并跳过完成态合入发版检查
    given: 用户要求重构导出接口并跑通原始导出场景，目前只改完字段映射且原始场景未跑通，用户此时要求收尾
    expect:
      must:
        - 在完成度裁决中判为未完成，说清已做到哪与还差什么
        - 第一轮抛出「继续做完 / 暂停挂起 / 彻底放弃」三选一作为首位拍板题
        - 跳过合入主分支、打 tag、发版与部署等完成态检查
      must_not:
        - 把未完成的代码推进提 MR/PR、合入主分支或发版
        - 未经用户选择自动清理分支或退出

  - id: paused-session-preserves-workspace-and-checkpoint
    kind: core
    judge: deterministic
    description: 用户确认暂停挂起时保住分支与 worktree 并固化恢复断点
    given: 主线未完成且使用 taskrail，分支 feat/export-refactor 有未提交改动与本地 dev 服务，用户在第一轮选择「暂停挂起」
    expect:
      must:
        - 保留分支与 worktree，不合入默认分支也不删分支
        - 保持 taskrail 状态为 active（不归档），更新断点信息并停掉确认后的本地服务
        - 第二轮开头点明已暂停挂起，写清现场位置与下次接手入口
      must_not:
        - 暂停时删除 worktree 或将任务关闭为 done/archived
        - 未经确认丢弃未提交改动

  - id: aborted-session-cleans-up-and-archives-uncompleted
    kind: core
    judge: deterministic
    description: 用户确认彻底放弃时逐项确认撤场并将 taskrail 归档为 archived
    given: 方案被证明不可行且使用 taskrail，存在草稿 MR、临时 worktree 与未提交改动，用户在第一轮选择「彻底放弃」
    expect:
      must:
        - 逐项确认丢弃未提交改动、关闭草稿 MR 与清理临时分支/worktree
        - 路由到 taskrail close 按未完成归档（archived 而非 done），注明放弃原因
        - 第二轮开头点明已确认中止并完成撤场
      must_not:
        - 将未完成放弃的任务标为 done 或伪写成功总结
        - 未经逐项确认直接删除分支或关闭 MR

  - id: external-wait-distinguished-from-zero-tail-closure
    kind: core
    judge: deterministic
    description: 已提 MR 但未合入且未开自动合并时，第二轮归为外部等待项而非彻底收工
    given: 代码已完成验证、推送并创建 MR !42，但目标分支需要 CI 与人工评审且未开自动合并
    expect:
      must:
        - 第二轮开头明确「本地已收尾、剩外部等待」，写清 MR 链接、未开自动合并及需回看点合入
        - 说明其余本地服务、临时痕迹已清空
      must_not:
        - 笼统宣称可以彻底放手不用再管

  - id: gap-without-tracker-needs-explicit-destination-or-drop
    kind: boundary
    judge: deterministic
    description: 无台账也无外部 tracker 时，遗留不能静默沉进聊天，须由用户选去向或确认放弃
    given: 主线已完成，过程中顺手发现一个无关的技术债，项目未使用 taskrail 也没有外部 Issue tracker
    expect:
      must:
        - 第一轮将该遗留放入拍板清单，让用户选择写入项目已有待办位置或明确确认不跟踪、直接放弃
        - 按用户确认执行落宿，或在用户明确确认不跟踪后在第二轮说明已确认放弃跟踪
      must_not:
        - 不经确认就把遗留静默留在聊天记录里
