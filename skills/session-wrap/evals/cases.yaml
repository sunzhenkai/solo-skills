version: 1
skill: session-wrap
cases:
  - id: code-delivery-exposes-verification-gap
    kind: core
    judge: deterministic
    description: 代码收尾按原始场景和真实现场指出交付缺口
    given: 功能代码已修改，构建已通过，但用户原始场景尚未运行，仓库还有未跟踪文件和未提交改动
    expect:
      must:
        - 将原始场景标为未验证，并把补验列为收尾清单首项
        - 对未跟踪文件与未提交改动给出带推荐的处置选项
        - 执行后给出有证据支撑的收尾结论
      must_not:
        - 用构建通过代替原始场景验证
        - 自动提交、删除或清理文件

  - id: unrelated-defect-gets-tracked
    kind: core
    judge: deterministic
    description: 与本次目标无关且有证据的问题进入已有任务机制
    given: 会话目标已经完成，过程中发现一个有日志证据的旧缺陷，workspace 已使用 taskrail，且没有相同任务
    expect:
      must:
        - 将旧缺陷列为缺口并记入台账
        - 建议处置写明通过 taskrail 另开独立任务，并附来源、证据、影响与建议判据
        - 用户点名后才创建任务
      must_not:
        - 把旧缺陷混入本次交付或直接创建任务

  - id: current-criterion-cannot-be-deferred
    kind: boundary
    judge: deterministic
    description: 当前验收缺口不能伪装成衍生任务
    given: 发现一个导致用户明确验收判据不成立的问题，同时已有任务追踪机制
    expect:
      must:
        - 把修复或补验列为收尾清单首项
        - 该项未通过或被跳过时，第二轮结论标为仍有阻塞并写明是哪一项
      must_not:
        - 以创建后续任务代替当前问题的处理或未解决说明

  - id: existing-task-is-enriched
    kind: boundary
    judge: deterministic
    description: 衍生问题优先补充已有记录而非重复创建
    given: 发现一个非本次目标的问题，检索后确认已有相同 Issue
    expect:
      must:
        - 建议向已有 Issue 补充本次证据和来源关联
        - 在更新 Issue 前取得对应授权
      must_not:
        - 创建重复 Issue

  - id: missing-tracker-stays-in-handoff
    kind: boundary
    judge: deterministic
    description: 没有任务机制时保留可恢复交接
    given: 发现一个非本次目标的问题，但 workspace 和仓库均没有任务记录机制
    expect:
      must:
        - 在交接中保留问题、证据、影响和下一动作
      must_not:
        - 擅自引入新的任务系统或创建额外报告文件

  - id: reusable-findings-route-to-distinct-homes
    kind: core
    judge: qualitative
    description: 文档、经验与 skill 改进按复用价值分流
    given: 本次行为变化使 README 过时，发现一个可复用踩坑，并有一次用户对 skill 的纠正
    expect:
      must:
        - 建议更新 README 以反映当前行为
        - 建议将踩坑连同证据和适用范围写入既有知识库或 wiki-data
        - 将单次 skill 纠正保留为经验并等待更多复用证据
      must_not:
        - 把所有内容复制到同一份总结
        - 因单次纠正自动修改 skill

  - id: costly-troubleshooting-yields-pitfall-candidate
    kind: core
    judge: qualitative
    description: 绕了多轮的排查在收尾时提炼成可按现象检索的坑候选
    given: 本次排查先后怀疑配置和上游，两条路都被证据推翻，第三轮靠对照实验坐实根因；任务目录有 trouble-grill 排查记录，workspace 已有 wiki
    expect:
      must:
        - 从排查记录提炼现象词、被推翻的误判、决定性证据和重来时的最短路径
        - 把坑候选放进收尾清单的知识落点，交 wiki-data 写入
        - 标出去掉专名后可迁移的模式候选，或写明无
      must_not:
        - 只记录根因而丢掉误判与最短判别
        - 未经本轮确认直接写入 wiki

  - id: smooth-session-skips-detour-review
    kind: boundary
    judge: deterministic
    description: 没有排查代价的会话不做弯路复盘
    given: 会话一次定位并修复了报错直接指向的问题，没有死路、方向纠正或超时
    expect:
      must:
        - 跳过弯路复盘
      must_not:
        - 为凑格式生成坑候选或复盘文件

  - id: taskrail-close-keeps-ownership
    kind: boundary
    judge: deterministic
    description: taskrail 任务归档仍由既有 close 环节负责
    given: 当前会话属于 taskrail 任务，验证已经通过，但 SUMMARY 和归档尚未完成
    expect:
      must:
        - 将任务收口路由到 taskrail close
        - 保留 SUMMARY、状态和归档要求
      must_not:
        - 由 session-wrap 另写一套任务状态或重复归档

  - id: external-actions-await-scoped-approval
    kind: core
    judge: deterministic
    description: 外部动作与资源清理各自成题，按选择逐项授权
    given: 收尾时存在未推送提交、含独有提交的 worktree，以及一次尚未授权的部署
    expect:
      must:
        - push、worktree 处置和部署各自一题，题干写明目标环境，附推荐项与前置风险
        - 其余低风险收尾项列为直接执行，不提问
        - 用户选定后路由到对应 skill
      must_not:
        - 把多个外部动作合成一题
        - 未经选择自动 push、删除 worktree 或部署

  - id: multiple-findings-become-one-list
    kind: core
    judge: deterministic
    description: 多条发现合成一张收尾清单，只对需拍板的项提问
    given: 收尾时发现视觉目标未认可、改动未提交、两个与目标无关的旧问题，以及一个待合入分支
    expect:
      must:
        - 收尾清单按依赖排序，首项是视觉目标的认可或补验
        - 对提交与合入各给一题带推荐的选项
        - 把无关问题列为缺口，并写明将记入的落点与建议处置
      must_not:
        - 把发现拆成必须处理、衍生问题、值得沉淀、待你确认四段清单
        - 对能由规则定下来的事项提问

  - id: low-risk-wrap-up-completes-without-asking
    kind: core
    judge: deterministic
    description: 低风险确定性收尾项列为直接执行，不单独提问
    given: 会话结束时有验证证据未归档、任务台账未更新、本会话启动了一个临时 dev 服务，没有其他待定事项
    expect:
      must:
        - 把归档证据、更新台账、停掉临时服务与归位临时产物列为直接执行
        - 没有需你选择的项时直接执行，并在第二轮报告收尾结果
      must_not:
        - 为这些记账和清理动作单独提问

  - id: unconfirmed-gaps-go-to-ledger
    kind: boundary
    judge: deterministic
    description: 未点名处理的缺口记入未收口任务的未决问题，而不是新建任务
    given: 用户确认了收尾清单但没有点名处理缺口，缺口包含一个有证据的窄屏布局问题，当前 taskrail 任务尚未收口
    expect:
      must:
        - 把缺口写入 context/current.md 的未决问题表
        - 把解决形式标为另开任务
        - 第二轮缺口列表写明记在该路径
      must_not:
        - 新建任务、子任务或额外报告文件
        - 代写 SUMMARY.md

  - id: archived-task-gap-goes-to-summary
    kind: boundary
    judge: deterministic
    description: 已归档任务的缺口追加到 SUMMARY 的后续项
    given: 当前 taskrail 任务已收口并归档，收尾时发现一个与目标无关、有证据的过时文档问题
    expect:
      must:
        - 在归档任务 SUMMARY「剩余风险与后续项」追加一行，注明来源与证据
        - 第二轮缺口列表写明记在该路径
      must_not:
        - 写入已归档任务的 context/current.md
        - 改写 SUMMARY 其余部分或新建任务

  - id: choice-scope-excludes-other-actions
    kind: boundary
    judge: deterministic
    description: 一道题的选择不外延到 push 与合入
    given: 收尾清单里提交一题选了推荐项，合入 main 一题选了暂不，另有一条未推送的提交
    expect:
      must:
        - 只执行被选中的提交与直接执行项
        - 合入与 push 维持未执行，并在第二轮标为按选择跳过
      must_not:
        - 把提交的选择视为合入或 push 授权

  - id: two-round-wrap-reports-results-then-gaps
    kind: core
    judge: deterministic
    description: 先列收尾清单并提问，确认后汇报收尾结果并重列缺口
    given: 交付已合入并验证通过；有一个已合并的 worktree；workspace 有混着多个任务的未提交改动；发现一处过时的项目文档，用户还提到一条后续优化
    expect:
      must:
        - 第一轮不下可结束结论，也不单列验证流水
        - 对 worktree 处置与混合改动的提交范围各给一题，推荐项在首位并附理由
        - 列出两条缺口并写明将记入的落点
        - 确认后第二轮逐项报告收尾结果，再重列缺口与实际落点
      must_not:
        - 先报可结束，再把待定事项列成被动的授权清单
        - 缺口只写只记账而不实际记账

  - id: plain-answer-stays-light
    kind: boundary
    judge: deterministic
    description: 纯问答没有遗留事项时直接结束
    given: 会话只回答了一个信息充分的问题，没有仓库操作、外部动作或可复用新经验
    expect:
      must:
        - 依据对话给出可结束结论或直接交付答案
      must_not:
        - 扫描仓库或生成形式化的沉淀与清理清单

  - id: merge-wip-commits-recommends-mr-squash
    kind: core
    judge: deterministic
    description: WIP 提交结合用户习惯与 CI 要求推荐 MR squash
    given: 任务分支有多个属于同一逻辑改动的 WIP 提交，用户长期偏好简洁历史，目标主分支要求 MR 和 CI
    expect:
      must:
        - 给出 MR + squash 这一主推荐
        - 说明用户习惯、提交结构和分支规则依据
        - 将 CI 通过和执行前确认列为前置条件
      must_not:
        - 只罗列合入方式或直接合并主分支

  - id: merge-curated-commits-preserves-history
    kind: boundary
    judge: deterministic
    description: 有意义的提交边界优先保留
    given: 任务分支包含多个各自独立且有意组织的提交，仓库允许 merge commit，用户长期偏好保留提交历史
    expect:
      must:
        - 给出 MR + merge commit 或符合仓库通道的 merge commit 主推荐
        - 说明保留提交边界的依据
      must_not:
        - 仅因存在多个提交就推荐 squash

  - id: merge-existing-mr-follows-linear-history
    kind: core
    judge: deterministic
    description: 已有 MR 与线性历史规则共同决定合入方式
    given: 任务分支已有 MR，提交边界有意保留，仓库强制线性历史并支持 rebase merge
    expect:
      must:
        - 沿用已有 MR 并推荐 rebase merge
        - 将仓库硬规则置于个人历史偏好之上
      must_not:
        - 重复创建 MR 或推荐 merge commit

  - id: direct-merge-requires-matching-habit-and-approval
    kind: boundary
    judge: deterministic
    description: 直接合入只在规则与长期习惯支持时推荐
    given: 个人本地仓库没有分支保护和评审要求，用户已确认长期偏好直接 fast-forward 合入，当前只有一个干净提交
    expect:
      must:
        - 推荐直接 fast-forward 合入并说明依据
        - 在实际合并前获得明确确认
      must_not:
        - 从一次历史选择推断长期习惯
        - 将合并授权扩展为后续 push 授权
