skill: task-confirm

problem: |
  F1 评审执行器未绑定：审阅节写「评审者三选一」但只给「何时」一列，
  允许静默回退普通 subagent；命中复杂档 approve 的环节实际退化为
  临时 prompt，专家角色清单、级别门、参照集机制全部丢失。
  F2 验收基准错置：无任何条目规定「基准物必须是标准/契约/基线」，
  外部产品因此被写进验收方式。
  F3 领域门路由缺失：没有「交付类别 → 门包」的真源表，任何 skill
  都无法声明某类交付必须加载哪些专家能力与自动化门。
  F7 未验证项无降级语义：[运行态] 条目未验证时无登记义务，
  未测被当作通过。

evidence:
  - 失效编号沿用优化方案 v4 的失效模式清单（F1 执行器未绑定 / F2 基准错置 /
    F3 门路由缺失 / F7 未验证即通过 / F11 评审同源）。
  - 2026-10-10 一次复杂档交付（Web UI）：全程三处评审均为普通
    subagent 临时 prompt，未加载 role-based-reviewer 的 design 角色
    清单；收尾评审给出高分而实际观感不合格；断点只测 2 档、
    焦点交互无证据，均未被登记为降级。
  - 同次任务的验收方式被写成「对照外部产品走查清单 + 截图」，
    外部产品事实上成了验收基准。

pattern: |
  评审与验收缺一个「单一真源」：谁审（执行器 + 角色）、拿什么当
  基准、没覆盖的怎么办——三件事散落在各 skill 与临时 prompt 里，
  于是每次都靠执行者即兴定义标准。UI 只是最先暴露的类别。

proposed_change: |
  仅改 task-confirm（SKILL.md + 新增 references/gate-packs.md）：
  1) SKILL.md 审阅节：评审者表保留三选一，但补「执行器绑定」——
     命中 role-based-reviewer 的环节 MUST 以 mode=review + 完整
     roles= + 审阅边界结构化调用；降级必须写明不可用原因并记录，
     静默降级等同审阅未做；交付验收 SHOULD 异源；[运行态] 条目
     须先给运行证据。
  2) SKILL.md 新增「未覆盖即降级」段：门包/运行态/判据任一条目未
     验证即生产性降级，按 quality-profile 定级登记，不得以
     「看起来没问题」通过。
  3) SKILL.md 退出点新增「评审降级未记录」。
  4) 新增 references/gate-packs.md：交付类别门包真源表（Web UI /
     服务 / 数据 / 部署密钥 / 文档 Skill）——每类给基准物、必载
     专家能力、自动化门、运行态证据、主观项处理；通则含
     「禁止把外部产品或参考实现当验收基准」与「门包三分」。
  追加契约测试与一条决策用例。

expected_improvement: |
  评审从「临时 prompt」变成「绑定执行器 + 角色清单 + 结构化边界」；
  验收基准被钉在标准/契约/基线；未覆盖项从静默忽略变成显式降级，
  进入已有 A/B 确认门。跨 skill 门包表述不再各写一份。

risk: low
