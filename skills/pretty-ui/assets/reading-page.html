<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面标题 · 内容集名称</title>
<!--
  pretty-ui 阅读页起手模板：复制到 <output-root>/ 下，改 title、导航链接、下面的方向卡和 :root 色值，正文换成真实内容。
  已内置：系统字体栈与中文回退、px 写的正文列宽、sticky 导航、text-wrap、代码关连字、等宽数字、
  宽表格与代码块各自横向滚动、:focus-visible、prefers-reduced-motion、暗色模式映射。
  轻量方向卡（栏目见 SKILL.md「轻量方向卡」）：
    北极星：
    字体：
    色彩：底色 / 主强调色 / 派生态，来源：
    特征元素：
    参照（取它哪一点）：
    放弃：
-->
<style>
:root {
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
  --font-serif: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "STSong", serif;
  --font-mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
  --surface: #fbfaf8;
  --surface-sunken: #f1efea;
  --text: #1f1d1a;
  --text-secondary: #57524b;
  --border: #dcd7cf;
  --action: #0f5c6e;
  --action-subtle: #e4eff1;
  --measure: 684px; /* 正文列：18px × 38 字，用 px 写在列容器上 */
  --page: 1200px;   /* 宽内容（表格、代码、图解）的容器 */
  --gutter: clamp(16px, 4vw, 48px);
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 24px; --space-6: 32px; --space-7: 48px; --space-8: 64px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1b1a18; --surface-sunken: #252320; --text: #ece8e1; --text-secondary: #b3ada3;
    --border: #3a3732; --action: #7cc4d4; --action-subtle: #1f3338;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--surface); color: var(--text); }
body { margin: 0; font: 18px/1.7 var(--font-sans); }
a { color: var(--action); text-underline-offset: 0.2em; }
a:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; border-radius: 2px; }
.site-nav { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border); }
.site-nav .inner { max-width: var(--page); margin: 0 auto; padding: var(--space-3) var(--gutter); display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-5); font-size: 15px; line-height: 1.5; }
.site-nav a { text-decoration: none; }
.site-nav [aria-current] { color: var(--text); font-weight: 600; }
main { max-width: var(--page); margin: 0 auto; padding: var(--space-7) var(--gutter) var(--space-8); }
.prose { max-width: var(--measure); }
h1, h2, h3 { margin: 0; line-height: 1.3; text-wrap: balance; }
h1 { font-size: 36px; line-height: 1.2; letter-spacing: -0.01em; margin-bottom: var(--space-3); }
h2 { font-size: 24px; margin: var(--space-7) 0 var(--space-3); }
h3 { font-size: 20px; margin: var(--space-6) 0 var(--space-2); }
p, li { text-wrap: pretty; }
p, ul, ol { margin: 0 0 var(--space-4); }
.lede { font-size: 20px; color: var(--text-secondary); }
.meta { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-4); margin-bottom: var(--space-6); font-size: 15px; color: var(--text-secondary); }
.summary { margin: var(--space-5) 0; padding: var(--space-4) var(--space-5); background: var(--action-subtle); border-radius: 6px; }
.wide { margin: var(--space-5) 0; overflow-x: auto; }
table { min-width: 100%; border-collapse: collapse; font-size: 16px; line-height: 1.5; font-variant-numeric: tabular-nums; }
th, td { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
th { font-weight: 600; }
.num { text-align: right; }
code, pre, kbd { font-family: var(--font-mono); font-size: 15px; font-variant-ligatures: none; }
pre { margin: var(--space-5) 0; padding: var(--space-4); overflow-x: auto; background: var(--surface-sunken); border-radius: 6px; line-height: 1.55; }
:not(pre) > code { padding: 0 var(--space-1); background: var(--surface-sunken); border-radius: 3px; }
@media (max-width: 600px) {
  body { font-size: 17px; }
  h1 { font-size: 30px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<nav class="site-nav" aria-label="站点导航">
  <div class="inner">
    <!-- href 换成相对当前文件的根聚合页，如 ./index.html 或 ../index.html -->
    <a href="#">全部内容</a>
    <span aria-current="page">页面标题</span>
  </div>
</nav>
<main>
  <article>
    <header class="prose">
      <h1>页面标题</h1>
      <p class="lede">一句导语：这页回答什么问题、写给谁。</p>
      <div class="meta"><span>文档类型</span><span>日期</span></div>
    </header>
    <div class="prose">
      <p class="summary"><strong>结论：</strong>输入里的核心结论。</p>
      <h2>小节标题</h2>
      <p>正文段落。连续正文留在 .prose 列里；表格、代码和图解放进 .wide，和正文共用左边缘。</p>
    </div>
    <div class="wide">
      <table>
        <thead><tr><th>字段</th><th>说明</th><th class="num">数值</th></tr></thead>
        <tbody><tr><td>名称</td><td>输入里的原文</td><td class="num">0</td></tr></tbody>
      </table>
    </div>
    <pre><code>命令或代码原样放这里</code></pre>
  </article>
</main>
</body>
</html>
