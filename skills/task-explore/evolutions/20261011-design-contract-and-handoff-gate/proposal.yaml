skill: task-explore

problem: |
  探索侧缺「契约冻结」这条链：
  F4 契约未冻结即并行——design 阶段的产物清单只有主设计 / ADR，
  不要求契约文件指针与证据计划，执行段因此拿到「无契约可依」的
  派发输入；handoff 门禁四项只核批准、命名、重复交接与降级，
  契约是否已在交付仓无人核对。
  F8 证据无契约——证据形式与产物状态绑定方式在探索侧无人声明。

evidence:
  - 2026-10-10 一次复杂档交付：design 阶段未落契约文件指针，
    执行段在共享面未冻结时并行铺开（该缺口已在 taskflow 侧补门）；
    handoff 时门禁不检查契约是否已存在于交付仓，交接完成即进入
    自动编排，契约缺失只能靠执行段事后发现。
  - 同次交付的证据计划（形式、状态绑定、覆盖边界）由执行段临时
    决定，探索侧无任何产物约束其形状。

pattern: |
  探索侧负责产出与交接，但产物清单与交接门禁都不含「共享面契约」
  这一类交付物；契约因此永远在生产段现造，而不是被设计、冻结、
  再交接。

proposed_change: |
  仅改 task-explore（SKILL.md + 两份 references）：
  1) references/phase-design.md：门禁新增「命中门包时必须含契约文件
     指针与证据计划，缺则按缺口停下」；三阶段写入表新增
     `design/contract.md` 行；边界新增「只留指针、契约本体落交付仓」。
  2) references/phase-handoff.md：单任务交接门禁新增第 5 条
     （契约指针与证据计划就绪 + 契约本体已在 `必须` 仓，否则停）；
     步骤 3 载荷补充交付类别 / 门包 / 基准物与契约指针写入 driver
     proposal（不复制契约本体）。
  3) SKILL.md：`design` 与 `handoff` 命令段各补一句与本轮门禁一致的
     指引。
  追加契约测试锁定关键句。

expected_improvement: |
  契约从「生产段现造」变为「设计期冻结 + 交接前核对 + 指针随载荷
  传递」；证据形状在探索侧即被声明，执行段只按计划取证。

risk: low
