skill: task-explore

problem: |
  与 taskrail evolutions/20261012-approve-exit-handoff 同一模式。
  approve 细则把下一步写成 handoff/propose，archive 允许不交接而结束并带着未决关闭。
  执行者只加载阶段细则时，仍会把方案落盘推荐为归档。

evidence:
  - 2026-10-12 一次真实执行：方案冻结后推荐探索侧归档，把实施说成另一个任务。
    详见 taskrail 同 slug 的 proposal.yaml。

pattern: |
  阶段细则的合法出口比脊柱档位表更宽：未交接、方案含实施、查证未闭，仍可叙述成关闭。

proposed_change: |
  phase-approve：APPROVED.md 下一步只写 handoff；出口不列 archive、另起任务、继续探索；
  未决不构成改推 archive 的理由；禁止改写 criterion；多条实施线进同一 driver 的子 change。
  phase-archive：方案已冻结且含实施、尚未 handed-off 时拒绝进入，改走 handoff。
  用户明确放弃或不实施时不拦截。保留「不要求清零」。
  SKILL.md archive 命令摘要同步拒绝进入这一句。
  契约测试加一条。

expected_improvement: |
  进入 approve 或 archive 细则时，与 taskrail「approve 出口」一致，不再把方案稿当成可归档的交付。

risk: low
