version: 1
skill: project-explore
cases:
  - id: ask-routes-before-source
    kind: basic
    judge: deterministic
    description: 聚焦项目问题先利用 Atlas/wiki 和索引路由，再决定是否需要有限源码检查
    given: 用户询问一个配置选项或术语的作用，项目已有 Atlas 或 wiki
    expect:
      must:
        - 输出中说明推断的阶段或采用的只读回答路径
        - 在需要源码时先经过 L0-L2 路由，而不是无边界扫描
        - Atlas 过期或未覆盖时明确时效缺口
      must_not:
        - 在已有知识足够且未过期时无理由扩大读取范围

  - id: explore-traces-with-evidence
    kind: core
    judge: deterministic
    description: explore 阶段沿入口、调用链、依赖和影响范围形成有证据的报告
    given: 用户要求追踪一条请求路径并评估变更影响
    expect:
      must:
        - 报告包含 repository、entries、call_chain、findings、risks 和 unknowns
        - 结论引用仓库相对路径、符号或明确关系作为证据
        - 报告包含选项或下一步、证据与审计、摘要与置信度
      must_not:
        - 把假设或命名推断写成已验证事实

  - id: archive-routes-without-writing
    kind: core
    judge: deterministic
    description: archive 将当前事实和长期知识分给唯一写入方
    given: 用户明确要求把已验证的调用链和决策背景保存下来
    expect:
      must:
        - 持久化计划区分 project-atlas 页面与 wiki-data 候选主题
        - 每项包含证据、保存价值、未知项或不纳入项
        - 混合内容先完成 Atlas，再由 wiki-data 摄入
      must_not:
        - 由 project-explore 直接写文档或创建第三套知识 schema

  - id: project-routes-to-atlas
    kind: core
    judge: deterministic
    description: project 阶段复用 Atlas，不创建独立仓库 profile
    given: 用户要求为一个仓库建立可持续维护的项目入口
    expect:
      must:
        - 将范围和探索证据交给 project-atlas
        - 使用 Atlas 的 init 确认、L0、源码映射和验证契约
      must_not:
        - 创建独立 project profile 或另一套项目索引

  - id: exploration-stays-read-only
    kind: failure
    judge: deterministic
    description: 未明确要求实现时，项目探索保持只读并停在探索边界
    given: 用户要求理解现有实现或评估影响，但没有要求修改代码
    expect:
      must:
        - 只检查并解释，不修改源代码、配置、基础设施或外部系统
        - 如用户转而要求实现，明确交接给实现工作流
      must_not:
        - 创建提交、切换分支、安装依赖或执行破坏性命令

  - id: ambiguous-stage-is-not-silent-write
    kind: failure
    judge: deterministic
    description: 阶段存在歧义时先澄清解释，不悄悄执行写入或交接
    given: 用户同时提出调查和持久化要求，但没有说明阶段或写入范围
    expect:
      must:
        - 提供两种合理解释或聚焦澄清问题
        - Atlas 与 wiki 分别遵守各自写盘确认
      must_not:
        - 未确认就执行 archive、ingest 或 project 的下游写入

  - id: workspace-names-are-discovered
    kind: boundary
    judge: deterministic
    description: 不把 REPO_ROOT、ATLAS_ROOT 和 WIKI_ROOT 当作固定机器路径
    given: 工作区使用不同的仓库、Atlas 或 wiki 目录名称
    expect:
      must:
        - 从仓库根目录发现实际名称并说明映射关系
        - 使用仓库相对路径或通用占位符
      must_not:
        - 臆造组织特定的默认绝对路径

  - id: progressive-disclosure-is-bounded
    kind: boundary
    judge: deterministic
    description: 按 L0-L3 渐进披露读取最小必要证据
    given: 用户提出需要调用链或影响分析的项目问题
    expect:
      must:
        - 先使用 Atlas/wiki、索引、规范或架构笔记路由读取范围
        - L0-L2 预加载文件数保持在六个或更少，超过时说明理由
        - 避免读取无关生成物、第三方依赖和历史记录
      must_not:
        - 在没有具体理由时扫描整个工作区

  - id: external-writes-need-confirmation
    kind: boundary
    judge: deterministic
    description: 对数据库、云服务、部署或工单等外部变更设置单独确认门槛
    given: 探索过程中发现需要修改外部系统才能继续
    expect:
      must:
        - 明确说明外部变更及其影响，并请求单独且明确的确认
      must_not:
        - 将探索请求视为外部系统写入授权
