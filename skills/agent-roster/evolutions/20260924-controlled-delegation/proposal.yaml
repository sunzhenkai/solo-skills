skill: agent-roster

problem:
  委派执行的两个系统性缺口：
  1) 适配器可用性无法由 L1/L2 探测推断——认证口径、模型解析、会话建立都只有 L3 冒烟能暴露；
     无 L3 成功记录就直接发正式任务时，失败以「正式任务失败」而非「零成本冒烟失败」的形式出现
  2) 长任务委派缺受控执行：契约把 timeout 列为必填字段但无执行约束，漏设后失败无法及时判定；
     进程监控用 pgrep -f 匹配命令行关键字会命中轮询命令自身，造成长时间假等待

evidence:
  - 2026-09-24 一次评审委派：L2 探测 ok 的 Endpoint 连续 3 次正式任务失败（2 次会话建立无响应、1 次被 SIGTERM 截断的半成品被误判成功）
  - 2026-09-24 换 Endpoint 后两次正式失败才定位：适配器只认特定环境变量名（配置用的是等价变量）；不显式传模型落到网关不存在的默认模型——两类问题都是一次冒烟即可发现的
  - 2026-09-24 同轮编排者失误：漏设 timeout；pgrep -f 关键字自匹配导致约 5 小时假等待
  - 先例：2026-09-23 与 2026-09-17 的 trace 已两次记录「acpx 形态只能靠冒烟验证」——本模式在不同任务累计 3 次证据

pattern:
  L3 冒烟是唯一可靠的适配器可用性验证；正式委派必须是受控执行（显式 timeout + 启动时记录 PID 监控）

proposed_change:
  1) references/delegation-contract.md「默认实现：acpx」节：
     a. 已知口径补 claude-acp 行（只认 ANTHROPIC_API_KEY 环境变量、不广告模型列表、不传 --model 落默认模型）
     b. 冒烟升级为门禁：该 Endpoint+模型组合无 L3 成功记录时，正式委派前必须先冒烟验证认证与模型解析
     c. 新增「受控执行」小节：timeout 必填；启动时记录 PID（$!）用 ps -p 监控；禁用 pgrep -f 关键字匹配（自匹配陷阱）
  2) SKILL.md「委派」节补一行指针：无 L3 成功记录先冒烟；timeout 必填 + PID 监控（细节指向契约）

expected_improvement:
  适配器类失败从「正式任务失败后排查」前移到「零成本冒烟即失败」；执行失控的发现时间从小时级降到 timeout 级

risk: medium
