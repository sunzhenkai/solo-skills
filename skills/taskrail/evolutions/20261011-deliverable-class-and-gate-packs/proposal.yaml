skill: taskrail

problem: |
  定档与完成门缺交付类别意识：
  F2 验收基准错置——质量属性节的验收方式可被写成「对照外部产品」，
  全链没有任何一环要求判定交付类别与基准物；
  F3 门路由缺失——wizard 定稿不产出「交付类别 + 适用门包」，
  下游 design/approve/handoff 的载荷因此无从携带门包与契约指针；
  F6/F7 完成门不机械——完成门只有「判据成立 / 交付标准 / checkbox /
  画像与降级」四条，未核对门包覆盖缺口与评审 findings 的 disposition，
  于是「未验证/未处置」也能判 done。

evidence:
  - 2026-10-10 一次复杂档交付：plan 的质量属性节把验收方式写成
    「对照外部产品走查清单 + 截图」；全链无人要求判定交付类别或
    基准物；任务收尾判 done 时，运行态条目未验证、评审 findings
    无 disposition 台账。
  - 同次交付的 design 阶段亦未产出共享面契约指针，导致执行段在
    契约未冻结的情况下并行（该缺陷已在 taskflow 侧补门，本轮补
    taskrail 侧的产出与载荷）。

pattern: |
  taskrail 是脊柱：它不定「交付类别 → 门包 → 基准物」这条线，
  下游所有 skill 都拿不到可携带、可机械核对的验收输入。

proposed_change: |
  仅改 taskrail（SKILL.md + 两份 references）：
  1) SKILL.md 主循环 wizard 行动作写明「落 wizard/plan.md（含交付
     类别与适用门包）」。
  2) SKILL.md 完成门新增第 5、6 条：命中门包时核对可自动化门全过、
     运行态证据齐、主观项按参照集/项目标准指认、未覆盖已登记降级；
     各轮评审 Blocker/Major 全有 disposition。并写明逐条机械核对。
  3) references/phase-wizard.md：原则加「交付类别必判」（引用
     task-confirm 门包表；禁止外部产品作基准）；模板新增
     「交付类别与门包」节；步骤 5 同步要求。
  4) references/contract.md：阶段载荷表 explore/design、design、
     approve、propose 四行补门包与契约文件指针；目录节补
     「design/ 落契约文件指针与证据计划」。
  追加契约测试锁定关键句。

expected_improvement: |
  验收从「外部产品对照」变成「交付类别 + 门包 + 基准物」，
  由 wizard 定稿并随载荷逐级携带；完成门可机械核对门包覆盖与
  findings disposition，未验证/未处置不再能判 done。

risk: low
