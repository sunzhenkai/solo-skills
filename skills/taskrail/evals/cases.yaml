version: 1
skill: taskrail
cases:
  - id: single-entry
    kind: basic
    judge: deterministic
    description: taskrail 是唯一编排入口
    given: 用户要端到端推进任务或 /goal 编排
    expect:
      must:
        - 绑定或创建 tasks/ongoing/{slug}/
        - 按 wizard → … → archive 推进；档位可跳过中间阶段
        - 确认闸口按 references/confirm-protocol.md
      must_not:
        - 另起 task-wizard / task-goal / task-delivery 入口

  - id: phase-resume
    kind: core
    judge: deterministic
    description: 可从 TASK.md.phase 恢复
    given: 用户 resume 已有任务
    expect:
      must:
        - 输出目标 / phase / 未决 / 建议下一步
        - 从当前 phase 继续，不默认重出 wizard
      must_not:
        - 覆盖已有任务目录

  - id: completion-gate
    kind: core
    judge: deterministic
    description: handed-off 不等于 done
    given: handoff 完成或 checkbox 全勾但判据不成立
    expect:
      must:
        - 完成门核对 criterion 与交付标准
      must_not:
        - 仅因 handed-off 或 propose 完标 done

  - id: simple-via-openspec
    kind: core
    judge: deterministic
    description: simple 档仍必须 handoff + taskflow 单切片
    given: wizard 定档 simple 且用户继续走 taskrail
    expect:
      must:
        - explore 仅为 grill
        - 轻量 approve 后 handoff 建 {slug}-driver
        - propose 单切片 → apply → archive
      must_not:
        - 无 driver 直接改业务代码
        - 把 grill 或 handoff 写入 TASK.md.phase

  - id: optional-worker-seat
    kind: core
    judge: deterministic
    description: Worker 派出推荐非强制；宿主 subagent 为抽象通道
    given: medium/complex 进入 explore/design/apply，或宿主无 subagent
    expect:
      must:
        - 可派出时优先宿主 subagent；grill 提问与闸口留主会话
        - 主会话只收 Digest，不回灌工具轨迹
        - 无派出能力时主会话自做，不退出轨道
      must_not:
        - 因缺少 subagent 停下或改道

  - id: web-ui-active-instance-wizard
    kind: core
    judge: deterministic
    description: Web UI 在 wizard 记录 Active Instance 状态；完成门核对 digest 未漂
    given: 交付类别为 Web UI
    expect:
      must:
        - wizard/plan.md 含 Active Instance 状态与三条 digest 或缺失与前置动作
        - medium/complex 无 freeze 时不得 approve 冻结
        - done 前核对 digest 与交付仓 freeze 一致
      must_not:
        - 把 tokens/primitive 精确值写入 tasks/

  # ---- 确认协议（原 task-confirm）----
  - id: dual-mode
    kind: basic
    judge: deterministic
    description: human 列选项；goal 审阅收敛即放行
    given: 任一确认闸口
    expect:
      must:
        - human 列选项含推荐；goal 写推荐默认并派审
        - 线上 / 泄密 / 未点名危险 / A 类 pending 永不因审阅自动放行
      must_not:
        - 编排档位或改 TASK.md.phase

  - id: pending-degrade-user-only
    kind: core
    judge: deterministic
    description: A 类 pending 只有用户能确认
    given: 显式降级表含 A 类 pending
    expect:
      must:
        - 审阅收敛与单独「继续」都不算确认
      must_not:
        - 执行者或评审者代确认 A 类

  - id: phase-is-progress-truth
    kind: basic
    judge: deterministic
    description: 新编排进度真相是 TASK.md.phase
    given: goal 模式推进
    expect:
      must:
        - 进度以 taskrail 契约的 phase / checkbox 为准
      must_not:
        - 强制依赖 goal_transition 四状态网格才能开工

  - id: human-gate-with-recommend
    kind: core
    judge: deterministic
    description: human 闸口禁止空问，须带推荐表
    given: human 模式确认闸口有未决口子
    expect:
      must:
        - 每个口子含问题、推荐、一句话理由
        - 收口可「按推荐」放行
      must_not:
        - 只列问题、不写推荐

  - id: reviewer-binding-and-gate-packs
    kind: core
    judge: deterministic
    description: 命中门包必载专家能力时必须结构化调用 role-based-reviewer；基准物禁外部产品；未覆盖即降级
    given: 交付面命中交付类别门包（如 Web UI），进入 approve 或收尾验收
    expect:
      must:
        - 按 references/gate-packs.md 选定交付类别门包
        - 以 mode=review + 完整 roles= + 审阅边界结构化调用 role-based-reviewer，并先提供运行态证据
        - 门包 / 运行态 / 判据未验证的条目按 quality-profile 定级登记为显式降级
      must_not:
        - 把外部产品或参考实现当作验收基准
        - 未写明不可用原因就退普通 subagent
  - id: web-ui-active-instance-baseline
    kind: core
    judge: deterministic
    description: Web UI 基准物绑定 frozen Active Instance；档位硬门；实现消费 frozen Active Instance
    given: 交付类别为 Web UI，medium/complex 进入 approve，或 simple 无 freeze 仅 adopt-only
    expect:
      must:
        - 基准物含 design-system/v1 Active Instance 的 status frozen 与 contract/binding/projection digest
        - medium/complex 无 freeze 时停下回 design 建立 Active Instance，不批准
        - simple adopt-only 须已确认显式降级；不强制代表页 two-pass / Gallery
        - medium/complex 视觉完成仍认 ui_evidence_check + design 评审；Gallery 与 digest 只证明系统未漂
      must_not:
        - 用散文组件约定或 ui-skills-root 替代 Active Instance
        - 无 Active Instance 且无已确认 adopt-only 降级时直接铺业务页
        - 仅用 Gallery 指针或 digest 作为视觉完成

  - id: web-ui-runtime-evidence-and-design-review
    kind: regression
    judge: deterministic
    description: Web UI 运行态证据与 design 评审按档调度（complex/medium 硬门；simple SHOULD）
    given: 交付类别为 Web UI，进入完成门
    expect:
      must:
        - complex：跑 scripts/ui_evidence_check.py 产出 report.json（双视口 + axe + 键盘 + 四态），design 评审 --validate-review exit 0
        - medium：同脚本 exit 0，允许精简 manifest（单路由 / 单桌面视口 / 四态可批量 not_applicable）
        - simple：ui_evidence_check 与 design 评审为 SHOULD；未跑须登记 B 类显式降级，quality floor 自检即可
      must_not:
        - simple 因未跑 ui_evidence_check 且未登记降级而标 done
        - medium/complex 用 Gallery 指针或 digest 代替运行态证据
  - id: ui-evidence-gate-fail
    kind: failure
    judge: deterministic
    description: 证据门 exit 1 / 2 都是阻断，不得放行
    given: axe 有 serious/critical、缺态、缺必需视口、焦点不可见、页面打不开（exit 1），或 manifest 不合法、playwright/axe-core 缺失（exit 2）
    expect:
      must:
        - 不批准完成，逐条列 FAIL 项并回实施修复后重跑
        - 依赖缺失按阻断处理，给出安装入口
      must_not:
        - 把缺依赖当作跳过
        - 实现者自评作为 design 评审（reviewer = implementer）
        - not_applicable 不写理由就省略某态

  - id: wizard-intent-first
    kind: core
    judge: deterministic
    description: wizard 第 1 步先确认意图
    given: 新任务进入 wizard（human）
    expect:
      must:
        - 委托 task-intent，给用户 ≤8 行意图复述并纠偏到确认
        - 落 wizard/intent.md 后再摸底写 plan
      must_not:
        - 未确认意图就写 wizard/plan.md

  - id: default-dispatch-digest
    kind: core
    judge: llm
    description: 执行座位默认派出、回 Digest
    given: medium 任务进入 design，宿主支持 subagent
    expect:
      must:
        - 派 worker 并给齐交接 5 项（目标 / 输入 / 写入范围 / 输出格式 / 停止条件）
        - 主会话只收 ≤10 行 Digest
      must_not:
        - 主会话转贴 worker 全文或工具轨迹
        - 把闸口或面向用户的提问派出

  - id: intent-closed-loop
    kind: core
    judge: llm
    description: 意图「做完的样子」从 wizard 流到完成门（跨 task-intent / taskrail / taskflow）
    given: medium 任务，intent.md 写「1 万行导出 ≤5 秒；不改报表格式」，已 apply 完
    expect:
      must:
        - wizard 定稿时 criterion 与「做完的样子」一致或写明差异
        - 验收 rubric 随附 intent.md
        - 完成门第 8 条逐条核对「做完的样子」与「不做」（格式未改）
      must_not:
        - 只看 checkbox 全勾就标 done
        - 交付时不读 intent.md

  - id: intent-change-mid-task
    kind: core
    judge: llm
    description: 中途改意图走契约「意图变更」
    given: design 阶段用户说「改成只做后端」；另一任务已 handed-off 时用户改完成标准
    expect:
      must:
        - 重跑 task-intent，intent.md version +1，旧版留在历史版本
        - 判据变化走确认协议显式改 criterion 并记决策
        - 未 handed-off 回退 phase（改范围已 approve 须重新 approve）；已 handed-off 经 taskflow 修订子 change
      must_not:
        - 用当轮叙事直接改 criterion
        - 在 grill 或 apply 中静默改写意图
