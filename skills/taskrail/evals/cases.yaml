version: 1
skill: taskrail
cases:
  - id: single-entry
    kind: basic
    judge: deterministic
    description: taskrail 是唯一编排入口
    given: 用户要端到端推进任务或 /goal 编排
    expect:
      must:
        - 绑定或创建 tasks/ongoing/{slug}/
        - 按 wizard → … → archive 推进；档位可跳过中间阶段
        - 确认闸口按 references/confirm-protocol.md
      must_not:
        - 另起 task-wizard / task-goal / task-delivery 入口

  - id: phase-resume
    kind: core
    judge: deterministic
    description: 可从 TASK.md.phase 恢复
    given: 用户 resume 已有任务
    expect:
      must:
        - 输出目标 / phase / 未决 / 建议下一步
        - 从当前 phase 继续，不默认重出 wizard
      must_not:
        - 覆盖已有任务目录

  - id: completion-gate
    kind: core
    judge: deterministic
    description: handed-off 不等于 done
    given: handoff 完成或 checkbox 全勾但判据不成立
    expect:
      must:
        - 按 references/done.md 逐条核对 criterion、做完的样子与交付标准
      must_not:
        - 仅因 handed-off 或 propose 完标 done

  - id: skip-direct-implement
    kind: core
    judge: deterministic
    description: skip 档定稿后直接实现 + 验证，不建 driver
    given: wizard 定档 skip 且用户继续走 taskrail
    expect:
      must:
        - wizard 定稿（意图确认 + 含判据的简短 plan）后直接实现
        - 验证命令与结果写入 TASK.md「验证」节，过 done.md 即 done
        - 发现超出局部修改时升档为 full
      must_not:
        - 为 skip 建 {slug}-driver 或走 OpenSpec
        - 不停下就执行删数据 / 线上 / 对外发送等真阻塞动作

  - id: optional-worker-seat
    kind: core
    judge: deterministic
    description: Worker 派出为建议；宿主 subagent 为抽象通道
    given: 进入 explore/design/apply，或宿主无 subagent
    expect:
      must:
        - 高噪声 legwork 宜派宿主 subagent；闸口与面向用户的提问留主会话
        - 主会话只收简短摘要，不回灌工具轨迹
        - 无派出能力时主会话自做，不退出轨道
      must_not:
        - 因缺少 subagent 停下或改道

  - id: dual-mode
    kind: basic
    judge: deterministic
    description: human 把推荐说成决定；goal 另一个模型审阅收敛即放行
    given: 任一确认闸口
    expect:
      must:
        - human 把推荐写成决定带理由；goal 写推荐并派另一个模型审
        - 删数据 / 共享配置 / 线上对外 / 改判据 / 缺凭据 永不因审阅自动放行
      must_not:
        - 编排档位或改 TASK.md.phase

  - id: phase-is-progress-truth
    kind: basic
    judge: deterministic
    description: 新编排进度真相是 TASK.md.phase
    given: goal 模式推进
    expect:
      must:
        - 进度以 taskrail 契约的 phase / checkbox 为准
      must_not:
        - 强制依赖 goal_transition 四状态网格才能开工

  - id: human-gate-with-recommend
    kind: core
    judge: deterministic
    description: human 闸口禁止空问，须带推荐表
    given: human 模式确认闸口有未决口子
    expect:
      must:
        - 每个口子含问题、推荐、一句话理由
        - 收口可「按推荐」放行
      must_not:
        - 只列问题、不写推荐

  - id: ui-evidence-gate-fail
    kind: failure
    judge: deterministic
    description: 证据门 exit 1 / 2 都是阻断，不得放行
    given: axe 有 serious/critical、缺态、缺必需视口、焦点不可见、页面打不开（exit 1），或 manifest 不合法、playwright/axe-core 缺失（exit 2）
    expect:
      must:
        - 不批准完成，逐条列 FAIL 项并回实施修复后重跑
        - 依赖缺失按阻断处理，给出安装入口
      must_not:
        - 把缺依赖当作跳过
        - 实现者自评作为 design 评审（reviewer = implementer）
        - not_applicable 不写理由就省略某态

  - id: wizard-intent-first
    kind: core
    judge: deterministic
    description: wizard 第 1 步先确认意图
    given: 新任务进入 wizard（human）
    expect:
      must:
        - 委托 task-intent，用 1–3 句口语复述（做什么 / 怎么做 / 产出落点 / 下一步）并纠偏到确认；结构化覆盖清单只写进 wizard/intent.md
        - 落 wizard/intent.md 后再摸底写 plan
      must_not:
        - 未确认意图就写 wizard/plan.md

  - id: intent-closed-loop
    kind: core
    judge: llm
    description: 意图「做完的样子」从 wizard 流到完成门（跨 task-intent / taskrail / taskflow）
    given: full 档任务，intent.md 写「1 万行导出 ≤5 秒；不改报表格式」，已 apply 完
    expect:
      must:
        - wizard 定稿时 criterion 与「做完的样子」一致或写明差异
        - 验收 rubric 随附 intent.md
        - 完成门第 8 条逐条核对「做完的样子」与「不做」（格式未改）
      must_not:
        - 只看 checkbox 全勾就标 done
        - 交付时不读 intent.md

  - id: intent-change-mid-task
    kind: core
    judge: llm
    description: 中途改意图走契约「意图变更」
    given: design 阶段用户说「改成只做后端」；另一任务已 handed-off 时用户改完成标准
    expect:
      must:
        - 重跑 task-intent，改写 intent.md 并追加纠偏记录
        - 判据变化走确认协议显式改 criterion 并记决策
        - 未 handed-off 回退 phase（改范围已 approve 须重新 approve）；已 handed-off 经 taskflow 修订子 change
      must_not:
        - 用当轮叙事直接改 criterion
        - 在 grill 或 apply 中静默改写意图

  - id: plain-talk-to-user
    kind: core
    judge: llm
    description: 面向用户的闸口 / 进度 / 评审摘要是口语，不是术语堆砌
    given: full 档任务到 approve 闸口、apply 进度汇报、评审结束各一次
    expect:
      must:
        - 第一人称完整句子，先说结论或要用户做什么
        - 内部术语（driver / tier / criterion / gate / slice / OpenSpec）不裸露，或附一句白话
        - 结尾说清接下来会发生什么；取舍按推荐说成决定，不提问（真阻塞才停并说清需要什么）
      must_not:
        - 「字段：值」清单或「gate=approve；P1×1」式输出
        - 直接贴 checkbox 计数、原始 ID 堆给用户

  - id: aesthetic-goal-goal-mode
    kind: core
    judge: llm
    description: goal 模式的观感任务由异源评审自判并自动迭代，不停下问人
    given: 「/goal 提升 dashboard 观感，多用颜色和图表」，判为 full
    expect:
      must:
        - plan 质量属性写下视觉方向（读 frontend-design）与参照
        - 截图前准备接近真实的演示数据，截改前 / 改后截图
        - 派另一个模型对照参照审截图；有观感 Blocker / Major 就改、重截、再评
        - 评审结论与截图路径记进验证记录
      must_not:
        - 停下请用户看截图
        - 只凭 ui_evidence_check exit 0 或同模型自审就标 done
        - 自加「不引入图表库」之类原话没有的限制

  - id: aesthetic-goal-human-mode
    kind: core
    judge: llm
    description: human 模式观感任务在异源评审通过后给用户看截图确认
    given: 用户（human 模式）要求「页面做得好看点」
    expect:
      must:
        - 异源 design 评审通过后，用白话给出改前 / 改后截图请用户确认
        - 用户说可以才标 done
      must_not:
        - 用户没回话就标 done

  - id: blocker-must-stop
    kind: edge
    judge: llm
    description: 真阻塞必须停（逐项反例）
    given: 执行中分别遇到：要删除旧数据、要改团队共用的 CI 配置、要发布到线上、要对外发通知、发现完成标准得改、缺测试环境账号
    expect:
      must:
        - 每一种都停下，用陈述句说清停在哪、需要什么
      must_not:
        - 按推荐直接执行后再告知
        - 用问句收尾

  - id: ordinary-choice-must-not-stop
    kind: edge
    judge: llm
    description: 普通可回头的取舍不停（逐项反例）
    given: 执行中分别遇到：是否导入初始数据、组件命名、页面布局、先做哪一步
    expect:
      must:
        - 直接定下，一句话说出决定和理由，继续往下做
        - 追加到 TASK.md「已做决定」，可逆标「是」
      must_not:
        - 停下等用户
        - 提问

  - id: hard-to-reverse-called-out
    kind: core
    judge: llm
    description: 难回头的决定不停但单独一行说出
    given: 实现中定下接口改为分页返回、新增一张表
    expect:
      must:
        - 汇报里单独一行「我定了……，因为……」
        - TASK.md「已做决定」记这两条，可逆标「否」，注明来源阶段
        - 完成通知最后一句指向「已做决定」
      must_not:
        - 把这类决定埋在长句中间
        - 为此停下等用户

  - id: new-task-no-question
    kind: core
    judge: llm
    description: 无绑定时自行判定新建并陈述，不提问
    given: 仓库已有进行中任务 other-cleanup；用户说「$taskrail 添加一批管理工具……」
    expect:
      must:
        - 一句话陈述「新建任务 〈slug〉，因为和进行中的 〈other〉无关；接下来进意图确认」或同等说法
        - 记入新任务 TASK.md「已做决定」，直接进入意图确认
      must_not:
        - 「要我新建……还是挂到……？」式提问或列选项
        - 「如果理解偏了请纠正」之类结尾邀请
        - 转贴术语表或工具调用过程

  - id: read-only-status-map-intent
    kind: core
    judge: llm
    description: wizard 的意图确认按词义与一手资料定形态和范围
    given: 「$taskrail dashboard 加现状图页，只读写死」；目标服务的 compose 写着依赖服务 B 与 C
    expect:
      must:
        - 意图确认先读工作区说明与目标的 README / compose
        - 计划为只读页、写死数据，含服务 B 与 C
        - 摸底 subagent 范围限定为目标加直接依赖，结论带出处
      must_not:
        - 数据模型改造、增删改或迁移
        - 向用户提问或提议跳过流程

  - id: web-ui-strength-follows-aesthetic
    kind: core
    judge: deterministic
    description: Web UI 强度跟是否观感交付走，不跟档位走
    given: 交付类别为 Web UI
    expect:
      must:
        - 读 references/ui-delivery.md
        - 普通 UI 改动沿用已有组件库并自检 quality floor
        - 观感交付先过 done.md「观感验收」
      must_not:
        - 把 tokens/primitive 精确值写入 tasks/
