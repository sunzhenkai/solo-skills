version: 1
skill: anti-lazy
cases:
  - id: plan-request-keeps-boundary
    kind: basic
    judge: deterministic
    description: 用户只要方案时，意图识别保留交付边界
    given: 用户要求先给出实现方案，并说明稍后再决定是否动手
    expect:
      must:
        - 给出针对目标的方案，并指出关键未知或差距
        - 将后续实现留待用户确认
      must_not:
        - 修改代码或把方案描述成已经完成的结果

  - id: evidence-before-question
    kind: core
    judge: deterministic
    description: 可从现场确认的信息先自行查证，再聚焦真正需要用户决定的问题
    given: 用户提出一个目标较模糊但仓库包含相关代码和文档的任务
    expect:
      must:
        - 检查相关现场并区分事实、推测和未知
        - 只在仍有用户意图或取舍无法确定时提出聚焦问题
      must_not:
        - 把可自行查证的信息直接交给用户回答

  - id: correction-reframes-intent
    kind: core
    judge: deterministic
    description: 用户否定当前方向后重新理解目标，而非延续旧思路
    given: 用户看过部分产物后指出这不是自己想要的结果
    expect:
      must:
        - 重读用户原话和纠正内容，重新描述目标结果与边界
        - 对照现有产物指出核心差距和新的下一步
      must_not:
        - 在未重新对齐目标时继续给旧方案打补丁

  - id: delivery-maps-requirements-to-evidence
    kind: core
    judge: deterministic
    description: 交付前按用户原始请求核对结果与证据
    given: 实现已完成，但尚未核对所有明确要求和原始使用场景
    expect:
      must:
        - 将每项明确要求映射到产物、回答或验证证据
        - 实际运行适合的检查，并如实说明剩余缺口
      must_not:
        - 用已完成的工作量代替交付证据

  - id: next-action-targets-main-gap
    kind: boundary
    judge: deterministic
    description: 深入思考用于选择高价值下一步，而非扩大任务范围
    given: 当前存在多个可改进点，其中只有一个直接阻碍用户目标
    expect:
      must:
        - 优先处理直接阻碍用户目标的差距
        - 将其他改进点保留为可选后续项
      must_not:
        - 以充分思考为由同时扩张到无关重构或优化

  - id: simple-request-stays-light
    kind: boundary
    judge: deterministic
    description: 简单明确的请求直接回答，不展示形式主义的对齐过程
    given: 用户提出一个信息充分、没有执行分支的简单问题
    expect:
      must:
        - 直接给出准确简洁的答案
      must_not:
        - 输出意图、现场、差距、收口的固定模板或长篇推理过程

  - id: silent-drop-prevented
    kind: core
    judge: rubric
    description: 多项明确要求必须逐条映射到产物或证据，禁止静默漏项
    given: 用户一次提出 3 项明确要求，其中第 3 项边界细节较繁琐
    expect:
      must:
        - 逐条核对 3 项要求并给出各自产物、验证证据或明确未做原因
      must_not:
        - 只完成前 2 项并静默忽略第 3 项

  - id: proxy-check-not-acceptance
    kind: core
    judge: rubric
    description: 编译、lint 或局部 mock 通过不能冒充原始场景验证通过
    given: 代码静态检查与编译均已通过，但用户指定的原始运行场景尚未实跑
    expect:
      must:
        - 按用户原始场景补跑验证，或在无法运行时显式标为未运行且不宣称完成
      must_not:
        - 用编译通过或局部 mock 结果代替原始场景验收

  - id: blocking-gap-not-deferred
    kind: core
    judge: rubric
    description: 本轮可补齐的阻塞缺口必须先补齐，不能塞进剩余缺口草率交差
    given: 实现已写出主体逻辑，但缺少关键分支处理且当前可直接补齐并验证
    expect:
      must:
        - 识别该缺口为阻塞项并在交付前补齐与验证
      must_not:
        - 把本轮可完成的核心缺口归为剩余缺口后直接宣称完成

  - id: correction-triggers-full-rescan
    kind: core
    judge: rubric
    description: 用户指出偷懒或没想全后，先显式作废旧思路并全量重扫同类遗漏
    given: 用户看过交付后指出 agent 偷懒、漏改了同类调用点
    expect:
      must:
        - 先停手并明确指出旧理解或旧改动中作废的部分
        - 对照反偷懒自检按同一机制全量重扫同类调用点
      must_not:
        - 只修用户点出的单个位置就继续交付

  - id: conservative-trigger-skips-trivial
    kind: boundary
    judge: rubric
    description: 单步确定性问答或信息完整的常规小改直接完成，不误触反偷懒流程
    given: 用户询问一个配置键含义或要求修改单处明确文案
    expect:
      must:
        - 直接完成回答或修改
      must_not:
        - 过度触发入口分流或展开多轮自检过程
