skill: task-delivery

problem:
  「同一验证连续失败两次」在本 skill 有两处副本（SKILL.md 硬边界、
  loop-protocol Stop conditions），仍是按外部条件计数的旧语义；
  task-goal 侧定义已改为按假设身份计数（20260930-hypothesis-streak），
  不同步会重演「三份同源纪律改一处漏两处」。

evidence:
  - 2026-09-30 task-goal 晋升 hypothesis-streak（commit fe9f0d6）；
    本 skill两处副本与其口径不一致。
  - 跨 skill 同步锁是该仓既有测试模式（taskflow
    TestPendingConfirmationSyncLock）。

pattern:
  同一封顶规则的多份副本必须同轮或紧随同步，否则执行者在两个
  skill 交界处读到两套计数语义。

proposed_change:
  仅同步两处副本为「同一假设下连败两次 + 假设封顶 3」语义，
  并指向 task-goal 侧定义；追加契约断言锁定同步。

expected_improvement:
  交界处语义一致；验证记录在两个 skill 里的口径统一。

risk: low（纯同步，不引入新机制）
