skill: task-delivery

problem:
  1) 等用户类停机是全局停摆：A 类降级 pending、真人门、异源选择、
     裁决任一命中即冻结全部 Stage——真实 case 实证一个 pending 降级
     导致交付代码量 0，尽管脚手架、环境准备、无关切片根本不依赖它。
  2) Stage 9 修复按轮次封顶（每窄切片两轮），与 task-goal 已修复的
     缺陷同构：修复引入的新 finding 烧掉轮次预算，修得好与修不好
     同判死刑。
  3) 真人门在自动续跑场景（用户缺席）无挂起形态；预算耗尽后
     「下一步」无恢复路径定义。

evidence:
  - 2026-09-30 两个真实 goal blocked case + 三份全族审计：D1（两轮
    封顶）、D3（预算耗尽无下一步）、D4（真人门无缺席语义）、
    F/D 系列（等用户全局停摆）。task-goal 侧已修（连败计数、
    suspension 五元组、A/B 分级），本 skill 是接入侧。

pattern:
  停止 = 全局停摆；修复 = 轮次预算；等待 = 无形态。三者都缺
  「局部性」与「按 finding 计数」，与 task-goal 旧缺陷同族。

proposed_change:
  仅改 SKILL.md（真人门 + 硬边界）与 references/loop-protocol.md
  （Stage 0 预算语义、Stage 2 冻结门、Stage 7 追认点、Stage 9、
  Stage 10 完成门、Stop conditions），新增 tests/：
  1) 等用户类停机按挂起五元组呈现（引用
     ../task-goal/references/suspension.md），只冻结依赖面：依赖
     该项的探索冻结/设计/实现切片停；环境准备、脚手架、只读取证、
     无关切片继续。
  2) 降级按 A/B 分级（引用 task-goal quality-profile）：A 类 pending
     停；B 类审阅临时确认（provisional）不停机；真人门 = B 类集中
     追认点（追认/否决按回滚说明）。
  3) Stage 9 改按 finding 连败计数（同条连续两轮仍在停 + 恶化闸），
     预算默认 repairs-per-slice<=2 改 repairs-per-finding<=2。
  4) 预算耗尽的「下一步」写恢复路径与授权形状。

expected_improvement:
  等用户不再清零全部进度；B 类降级与真人门合并为一次追认交互；
  修复循环真失败（连败/恶化）仍封顶；预算耗尽可恢复。

risk: medium（改停止条件与修复封顶语义，安全边界不放宽）
