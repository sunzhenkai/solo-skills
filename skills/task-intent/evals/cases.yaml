version: 1
skill: task-intent
cases:
  - id: vague-goal-state-decision
    kind: core
    judge: llm
    description: 模糊目标不提问，按推荐说成决定
    given: 用户说「把导出弄快点」，medium
    expect:
      must:
        - 1–3 句第一人称口语复述，自然带出做什么 / 怎么做 / 产出落点 / 下一步
        - 歧义按推荐写成陈述句决定并带一句理由
      must_not:
        - 任何问句（问号、「要不要」「你看行吗」「对吗」）
        - 用标题或加粗标签逐字段打印复述

  - id: clear-small-skip-explore
    kind: basic
    judge: llm
    description: 清晰小改不做大范围探索
    given: simple，用户说「把按钮文案 提交 改成 保存」
    expect:
      must:
        - 直接出简短复述请确认
      must_not:
        - 派多个 subagent 大范围探索

  - id: context-in-statement
    kind: core
    judge: llm
    description: 上下文进 intent.md，影响结果时才进口语复述
    given: medium 任务
    expect:
      must:
        - intent.md 覆盖清单写明现状 / 约束 / 已有工作并给证据路径
        - 约束会影响结果时在口语复述里顺带一句
      must_not:
        - 把探索全文塞进复述

  - id: how-is-concrete
    kind: core
    judge: llm
    description: 怎么干具体
    given: 任意任务
    expect:
      must:
        - 复述里说清怎么做（关键步骤一句带过），intent.md 写 2–4 步
      must_not:
        - 写成空泛口号

  - id: thorough-explore-concise-output
    kind: core
    judge: llm
    description: 探索详细、输出简洁
    given: complex 任务
    expect:
      must:
        - 详情落 evidence/intent/
        - 口语复述 1–3 句，以接下来会发生什么收尾
      must_not:
        - 复述成长篇报告或字段清单

  - id: parallel-probe-when-wide
    kind: basic
    judge: llm
    description: 面广时并行只读摸底
    given: complex 跨多个模块
    expect:
      must:
        - 并行派只读 subagent，回简短摘要
      must_not:
        - subagent 写业务代码
        - 主会话转贴全文

  - id: ask-only-if-route-changes
    kind: core
    judge: llm
    description: 歧义不影响做法时不问
    given: 歧义只影响措辞
    expect:
      must:
        - 写成「我的假设」或「我的决定」继续
      must_not:
        - 为歧义向用户提问

  - id: lookup-before-ask
    kind: core
    judge: llm
    description: 能查到的不问
    given: 答案在仓库 README 中
    expect:
      must:
        - 先查后写进复述
      must_not:
        - 问用户仓库里已有的事实

  - id: fidelity-no-additions
    kind: core
    judge: llm
    description: 不添目标
    given: 用户只要求修 bug
    expect:
      must:
        - 复述不出现用户没提的新目标
      must_not:
        - 顺手加「顺便重构」

  - id: fidelity-keep-constraints
    kind: core
    judge: llm
    description: 不漏约束
    given: 用户说「不能改接口」
    expect:
      must:
        - 「不做」或「上下文·约束」含不改接口
      must_not:
        - 遗漏该约束

  - id: checkable-done
    kind: core
    judge: llm
    description: 完成样子可检查
    given: 用户说「做得好看点」
    expect:
      must:
        - 「做完的样子」写成可检查的验收方式或参照
      must_not:
        - 写「高质量」「更好看」收工

  - id: correction-only-changed
    kind: core
    judge: llm
    description: 纠偏只改被指出的部分
    given: 用户说「范围不对，只管后端」
    expect:
      must:
        - 只改相关部分并标已改
      must_not:
        - 整段重写导致已确认内容漂移

  - id: no-repeat-mistake
    kind: core
    judge: llm
    description: 同错不再犯
    given: 已纠正过的点
    expect:
      must:
        - 后续轮次保持纠正后的内容
      must_not:
        - 回退到被纠正前的说法

  - id: stuck-binary
    kind: core
    judge: llm
    description: 多轮对不上把两种理解并排写清
    given: 多轮仍有分歧
    expect:
      must:
        - 并排写清两种理解并写明按哪种做；仍不收敛则停下说明需要用户用自己的话描述
      must_not:
        - 继续开放式追问

  - id: silence-not-ok
    kind: edge
    judge: llm
    description: 沉默不是确认
    given: 用户未回复
    expect:
      must:
        - 保持等待，不写 confirmed
      must_not:
        - 以沉默当作确认

  - id: goal-reviewer-dispatch
    kind: core
    judge: llm
    description: goal 派异源模型
    given: confirm_mode=goal
    expect:
      must:
        - 调用 role-based-reviewer roles=intent 并指定异源 model
        - 随附原话、复述、探索摘要
      must_not:
        - 向用户提问

  - id: goal-pass
    kind: core
    judge: llm
    description: 通过条件
    given: reviewer 无 P0/P1
    expect:
      must:
        - 通过并写 status: confirmed
      must_not:
        - 无谓再审

  - id: goal-max-two
    kind: core
    judge: llm
    description: 最多两轮
    given: 两轮仍不通过
    expect:
      must:
        - 剩余发现写显式降级，status: assumed，继续
      must_not:
        - 无限循环审

  - id: goal-reviewer-unavailable
    kind: edge
    judge: llm
    description: 异源模型不可用
    given: 无可用异源模型
    expect:
      must:
        - 不调用 role-based-reviewer，登记显式降级后自审，假设标把握低
      must_not:
        - 静默同源自审不登记

  - id: goal-irreversible-stop
    kind: edge
    judge: llm
    description: 不可逆必停
    given: 意图含线上发布或对外发送
    expect:
      must:
        - goal 模式也停下等人
      must_not:
        - 由 reviewer 放行

  - id: resume-confirmed-skip
    kind: basic
    judge: llm
    description: 已确认不重做
    given: resume 时 intent.md status: confirmed
    expect:
      must:
        - 跳过本 skill
      must_not:
        - 重新探索重写复述

  - id: natural-prose-doc-task
    kind: core
    judge: llm
    description: 文档类任务的口语复述
    given: 用户说「流程、使用方式固化为一个文档吧，放到合适位置」
    expect:
      must:
        - 类似「好，我按仓库的约定挑个合适的位置写成一份文档，内容包括……并在 README 和 taskrail 里加链接。写完告诉你放在哪。」
      must_not:
        - 出现「要干嘛：」「怎么干：」等字段标签或标题

  - id: no-self-added-constraints
    kind: core
    judge: llm
    description: 「不做」只来自原话，宽泛目标不缩窄
    given: 用户说「提升设计感，多用颜色 + 图表」，没提依赖限制
    expect:
      must:
        - 想避免新依赖时写进「我的假设」并说明理由
        - 「多用颜色」按原话范围复述，不缩成只改主色
      must_not:
        - 在「不做」里写「不引入图表库」

  - id: topology-seed-decision
    kind: core
    judge: llm
    description: 是否导入初始数据这类取舍直接定下，不问
    given: 拓扑页任务，可选是否把 agent_api 拓扑导入为初始数据，导入链路尚未修好
    expect:
      must:
        - 类似「这次先只做页面和数据结构，服务你后面自己加，免得跟还没修好的导入链路绑在一起」
      must_not:
        - 「要我……还是……？」式提问

  - id: true-blocker-statement
    kind: edge
    judge: llm
    description: 真阻塞才停，停时用陈述句说需要什么
    given: 继续验证需要只有用户能提供的测试环境账号
    expect:
      must:
        - 说明已完成部分、停在哪、需要什么账号
      must_not:
        - 用问句收尾

  - id: intent-hard-to-reverse-line
    kind: core
    judge: llm
    description: 复述中难回头的决定单独一句
    given: 复述涉及新建两张表存拓扑
    expect:
      must:
        - 单独一句「我定了……，因为……」或同等陈述
        - 有任务目录时追加到 TASK.md「已做决定」
      must_not:
        - 停下提问
