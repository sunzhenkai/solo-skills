skill: role-based-reviewer

problem: |
  9 个角色文件为简单初始化：engineer 36 行，algo/data/sre/ops/biz/product/qa 各 26-29 行，
  只有一句话锚点 + 约 10 条短语清单，缺「什么算命中」的判据与「什么不算问题」的误报澄清。
  门 3（发现克制）要求防吹毛求疵，但角色文件没有支撑它的反模式示例，
  同级别问题在不同评审中口径不稳。

evidence:
  - 2026-09-29 行数统计：roles/*.md 除 design(113) 外均 ≤36 行
  - 2026-09-29 内容核查：清单条目均为单行短语，无判据、无误报澄清、无示例
  - 编排层（三道门禁 / preload / brief / 边界 redirect）完整，缺口集中在角色内容层

pattern: |
  角色化评审的稳定性来自「判据 + 反例」而非清单长度。
  成熟公开评审指南以「判据 + 示例」组织（含明确的「评审者不应要求什么」），
  借骨架不抄内容。

proposed_change: |
  第一批加厚 engineer / qa / product 三个角色文件：
  1) 每条清单补一句「命中判据」；
  2) 新增「不算问题」小节（1-3 条常见误报澄清，门 3 的角色级落地）；
  3) 结构沿用 engineer 现有骨架（优先锚点 / 跳过 / 分级清单 / 下游建议 / redirect），
     不改 SKILL.md 三道门禁、preload-protocol、brief-protocol、role-vocabulary。
  其余 6 个角色（algo/data/sre/ops/biz/design）留第二批。

external_references: |
  参照轮（2026-09-29，按 task-wizard 外部参照细则执行：先搜后读、读原文限两处/角色、来源分级）：
  - engineer + qa（共源）：google/eng-practices《What Code Reviewers Look For》
    （原文镜像 zread.ai/google/eng-practices/8；上游 google.github.io/eng-practices 当时不可达）。
    对上事实：分级检查框架（设计/功能/复杂度/测试/命名/注释/风格/一致性/文档）；
    过度工程警告（警惕解决推测性未来问题）；测试有效性判据（代码中断时测试须失败）；
    风格未覆盖的建议标 Nit（=可选，不升级）；正向强化（承认良好实践）。
  - engineer（安全维）：OWASP Code Review Guide / WSTG 检查单仅搜索命中、未读原文，
    安全条目判据按通用公开共识写，记为假设（缺一处原文对证）。
  - qa：testing.googleblog.com flaky 治理系列仅搜索命中未读原文；flaky 判据按公开共识写，记为假设。
  - product：需求评审公开清单未命中可读原文；条目按 IEEE 830 式公开共识
    （明确/可验收/一致/闭环/不做什么）写，记为假设。

expected_improvement: |
  三个高频角色的分级结论口径稳定，误报下降；门 3「不确定的不当 Blocker」
  有角色级反例可援引；为第二批 6 个角色建立可复制模板。

risk: low
# 纯内容加厚，不改触发条件、不改门禁、不改加载协议。
