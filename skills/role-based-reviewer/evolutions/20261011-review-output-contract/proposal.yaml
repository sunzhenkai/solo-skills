skill: role-based-reviewer

problem: |
  输出契约缺三件，导致评审结论无法被交付流程当作可追踪、可收敛的
  证据：
  F8 证据无状态绑定——报告不写它审的是哪个产物状态，产物一变
  （或评审发生在提交前）结论即成无主断言；
  F6 findings 无稳定编号与处置位——taskflow 要求 Blocker/Major
  全有 disposition，但报告的 findings 无编号，处置台账无法引用；
  F7 未覆盖项无降级语义——「未覆盖项」只写「因信息不足未能判断的
  点」，不要求写原因、建议处置与工具不可用时的替代边界，缺项因此
  在调用方侧容易被当成通过；门 1 也未写明边界缺项时的报告义务。

evidence:
  - 2026-10-10 一次复杂档交付：三处评审由临时 prompt 执行（该缺口已在
    task-confirm 侧补门）；即便按本 skill 正常执行，报告也不含产物状态、
    findings 无编号、未覆盖项无降级建议，与 taskflow「findings 全有
    disposition」「证据绑定产物状态」两项无法衔接。
  - 同次交付的「未覆盖项」仅列信息不足点，未给出替代方法边界与
    A/B 定级建议。

pattern: |
  评审输出是交付收敛链的证据源，但它本身没有「状态绑定 +
  可引用编号 + 未覆盖降级建议」这三条证据契约，于是调用方拿到的
  是散文式结论而非可登记、可收敛的台账输入。

proposed_change: |
  仅改 role-based-reviewer（SKILL.md + references/brief-protocol.md）：
  1) SKILL.md 门 1：结构化调用的审阅边界列举补「命中门包时的门包与
     运行态证据」，并写明边界缺项不构成拒审理由——按已有边界审查、
     报告开头写明缺项、受影响条目标未验证，不得把缺项当通过。
  2) SKILL.md 输入节：审阅边界输入补门包与运行态证据；新增
     `产物状态` 输入项（提交号 / dirty 摘要，未给则评审自取并注明）。
  3) SKILL.md 输出节：新增「依据状态」「未覆盖项与降级建议」「findings
     稳定编号」三项要求，并写明报告只对标识状态有效、处置由调用方
     记录、本 skill 不代判收敛。
  4) references/brief-protocol.md：聚合骨架新增「依据状态」节、findings
     加 `F-<n>` 编号示例、「未覆盖项」升级为「未覆盖项与降级建议」；
     字段约定新增状态绑定、编号稳定、缺项不担保三条。
  追加契约测试锁定关键句。

expected_improvement: |
  评审报告成为可追踪证据：结论绑定产物状态；findings 可用编号进入
  处置台账；未覆盖项带原因与降级建议，直接接入「未覆盖即降级」门；
  边界缺项在报告里可见，不能在调用方侧被当成通过。

risk: low
