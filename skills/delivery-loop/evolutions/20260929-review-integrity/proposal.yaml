skill: delivery-loop
date: 2026-09-29
slug: review-integrity

problem:
  主循环 Stage 7–12 在 taskflow 交接后没有执行实体——「进度只认 driver checkbox」
  把执行权让给 driver，阶段文本无人触发；交接后中途长出的派生 driver 收工时
  以自定验收自证完成，主循环完成门被静默替代。同时 Stage 7 评审默认同进程同模型，
  对审美/体验类目标收敛到「自洽」而非「正确」；真人终审在收口才首次发生。

evidence:
  - 2026-09 一次完整 UI 交付闭环（抽象）：约 49 轮迭代、逐格确定性度量 0 违规、
    3 名同源裁判逐轮稳定高分（极差 ≤1）；使用者第一次实看即判「简陋、不优雅」。
    稳定性判据证明了一致性，不证明与人类审美的对应。
  - 同次闭环的交付仓全文检索：主循环定义的 product/design/engineer 三角色评审
    零执行记录；实际验收真相源被循环中途自建的第二裁判闭环（自写 rubric）替换，
    两套口径从未映射或冲突检查。
  - 外部锚校准（异源样本）在收口后才补跑，判出 rubric 与页面形态错配——
    该信号在迭代期内不存在；天花板条款（「卓越」的可数构成件）始终未定义。
  - 归因分析：四项缺口（无目标长相自举、rubric 天花板只到「合格」、构图层无验收、
    真数据呈现未验）均非实现 bug，属机制缺口——换任务仍会错。

pattern:
  评审者与实现者同源时，评审分数是实现的回声（同模型共享盲点、同 rubric 共享
  天花板、稳定 = 自洽）；审美类目标的天花板只能由异源评审 + 真人中途介入定义和
  背书；子循环收口没有回归上层循环的机制时，主循环完成门会被任何「看起来更严格」
  的自定验收静默替代。

proposed_change:
  三处最小 patch（SKILL.md 主循环 + 新增「观感类质量目标」节 + loop-protocol.md Stage 7）：
  1. Stage 7 异源门：评审 MUST 与实现异源，按序降级——(a) 经 agent-roster 委派
     reviewer/designer 到其他 Endpoint 的其他 coding agent；(b) 本机 subagent 显式
     指定与实现不同的模型跑 role-based-reviewer；(c) 两者皆不可用则停下问使用者，
     禁止静默同源自审交卷。同源评审输出只作线索、不作通过线。
  2. 观感类质量目标分支（质量目标含无法用确定性度量完备验收的项时）：
     - 天花板前置：进入实现前 MUST 先定「卓越」的可数构成件或外部参照集；缺失则
       停下找使用者补，禁止以「无缺陷」默认收工；
     - 度量只声明地板：完成报告 MUST NOT 用度量全绿支持「美观/优雅达标」类表述；
     - 中途真人门：每个修复轮后 MUST 给使用者看最小一批实物并收一句反馈再继续；
       使用者未看过实物的视觉交付不得进入收口。
  3. 主循环回归门：driver（含交接后中途长出的任何派生 driver / 子循环）收口时，
     MUST 回到主循环 Stage 7–12 继续执行，不得以子循环自定验收替代主循环完成门；
     子循环自定 rubric 与 acceptance-rubric 口径冲突时，冲突项 MUST 停下报使用者裁决。

expected_improvement:
  评审分数从「自洽证据」变为「独立证据」；审美类交付的使用者负反馈从开箱时刻
  提前到迭代中途；「全绿但不达标」与「主循环被旁路」两类失败在机制上不可再发生。

risk: medium
  （扩大委派范围到跨端点；中途真人门增加闭环节奏开销——门只要求最小一批 + 一句话。）
